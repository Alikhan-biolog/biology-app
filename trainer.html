:["Артериальную кровь — от левого желудочка к органам","Венозную кровь — от правого желудочка к лёгким","Артериальную кровь — от лёгких к левому предсердию","Венозную кровь — от органов к правому предсердию"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Артерии несут кровь от сердца, вены — к сердцу, независимо от того, какая в них кровь."},"kk":{"body":{"stem":"Қан тамырын оның қандай қанды қайда апаратынымен сәйкестендіріңдер.","left":["Қолқа","Өкпе артериясы","Өкпе веналары","Қуыс веналар"],"right":["Артерия қанын — сол жақ қарыншадан мүшелерге","Вена қанын — оң жақ қарыншадан өкпеге","Артерия қанын — өкпеден сол жақ жүрекшеге","Вена қанын — мүшелерден оң жақ жүрекшеге"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Артериялар қанды жүректен әкетеді, веналар — жүрекке әкеледі, ішіндегі қанның түріне қарамастан."}}},{"id":"bio8-23-q05","topic_id":"bio8-23","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"95"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку путь крови по большому кругу кровообращения.","items":["Левый желудочек","Аорта","Артерии и капилляры органов","Верхняя и нижняя полые вены","Правое предсердие"],"start":[3,0,4,2,1]},"answer":{"order":[0,1,2,3,4]},"explanation":"Схема 6: левый желудочек → клетки организма → правое предсердие. По пути артериальная кровь отдаёт кислород и становится венозной."},"kk":{"body":{"stem":"Үлкен қан айналым шеңбері бойынша қанның жолын ретімен орналастырыңдар.","items":["Сол жақ қарынша","Қолқа","Мүшелердің артериялары мен капиллярлары","Жоғарғы және төменгі қуыс веналар","Оң жақ жүрекше"],"start":[3,0,4,2,1]},"answer":{"order":[0,1,2,3,4]},"explanation":"6-сызба: сол жақ қарынша → дене мүшелері мен ұлпалары → оң жақ жүрекше. Жол бойында артерия қаны оттегін беріп, вена қанына айналады."}}},{"id":"bio8-23-q06","topic_id":"bio8-23","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"97"},{"source_id":"src-bio8-kk","pages":"103"}],"versions":{"ru":{"body":{"template":"Между левым предсердием и левым желудочком находится {{1}} клапан, а между правым предсердием и правым желудочком — {{2}} клапан.","choices":["двустворчатый","трёхстворчатый","полулунный","венозный"]},"answer":{"blanks":[0,1]},"explanation":"Створчатые клапаны: слева двустворчатый, справа трёхстворчатый. Полулунные клапаны стоят у выхода аорты и лёгочной артерии."},"kk":{"body":{"template":"Сол жақ жүрекше мен сол жақ қарынша арасында {{1}} қақпақша, ал оң жақ жүрекше мен оң жақ қарынша арасында {{2}} қақпақша орналасқан.","choices":["қосжақтаулы","үшжақтаулы","жарты ай тәрізді","вена"]},"answer":{"blanks":[0,1]},"explanation":"Жақтаулы қақпақшалар: сол жақта қосжақтаулы, оң жақта үшжақтаулы. Жарты ай тәрізді қақпақшалар қолқа мен өкпе артериясының шығар жерінде орналасқан."}}},{"id":"bio8-23-q07","topic_id":"bio8-23","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"97"},{"source_id":"src-bio8-kk","pages":"102–103"}],"versions":{"ru":{"body":{"stem":"Сколько, по учебнику, длится полный цикл сокращения и расслабления сердца?","options":["0,1 с","0,3 с","0,4 с","0,8 с"]},"answer":{"correct":3},"explanation":"Предсердия сокращаются 0,1 с, желудочки — 0,3 с, общее расслабление длится 0,4 с; всего 0,8 с."},"kk":{"body":{"stem":"Оқулық бойынша жүректің толық жиырылып, босаңсуы қанша уақытқа созылады?","options":["0,1 с","0,3 с","0,4 с","0,8 с"]},"answer":{"correct":3},"explanation":"Жүрекшелер 0,1 с, қарыншалар 0,3 с жиырылады, жалпы босаңсу 0,4 с созылады; барлығы 0,8 с."}}},{"id":"bio8-23-q08","topic_id":"bio8-23","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"97"},{"source_id":"src-bio8-kk","pages":"103"}],"versions":{"ru":{"body":{"stem":"Где расположены полулунные клапаны?","options":["Между предсердиями и желудочками","У выхода аорты и лёгочной артерии из желудочков","Внутри полых вен","Между левым и правым желудочками"]},"answer":{"correct":1},"explanation":"Полулунные клапаны отделяют желудочки от аорты и лёгочной артерии; между предсердиями и желудочками стоят створчатые клапаны."},"kk":{"body":{"stem":"Жарты ай тәрізді қақпақшалар қай жерде орналасқан?","options":["Жүрекшелер мен қарыншалардың арасында","Қолқа мен өкпе артериясының қарыншалардан шығар жерінде","Қуыс веналардың ішінде","Сол және оң қарыншалардың арасында"]},"answer":{"correct":1},"explanation":"Жарты ай тәрізді қақпақшалар қарыншаларды қолқа мен өкпе артериясынан бөледі; жүрекшелер мен қарыншалардың арасында жақтаулы қақпақшалар орналасқан."}}},{"id":"bio8-23-q09","topic_id":"bio8-23","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"94"},{"source_id":"src-bio8-kk","pages":"100"}],"versions":{"ru":{"body":{"stem":"У каких животных, по учебнику, замкнутая кровеносная система? Выберите все верные ответы.","options":["Кольчатые черви","Насекомые","Позвоночные","Брюхоногие моллюски"]},"answer":{"correct":[0,2]},"explanation":"Замкнутая система — у кольчатых червей и позвоночных. У насекомых и брюхоногих моллюсков система незамкнутая."},"kk":{"body":{"stem":"Оқулық бойынша қай жануарлардың қан тамырлары жүйесі тұйық? Барлық дұрыс жауапты таңдаңдар.","options":["Буылтық құрттар","Бунақденелілер","Омыртқалылар","Бауыраяқты ұлулар"]},"answer":{"correct":[0,2]},"explanation":"Тұйық жүйе буылтық құрттар мен омыртқалыларда болады. Бунақденелілер мен бауыраяқты ұлуларда жүйе ашық."}}},{"id":"bio8-23-q10","topic_id":"bio8-23","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"97"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Почему в сердце птиц и млекопитающих артериальная и венозная кровь не смешивается?","options":["В сердце нет предсердий","У них только один круг кровообращения","Сплошная перегородка делит сердце на правую и левую половины","Кровь смешивается только в капиллярах лёгких"]},"answer":{"correct":2},"explanation":"Правая половина сердца содержит венозную кровь, левая — артериальную; перегородка их разделяет. У земноводных в общем желудочке кровь смешанная."},"kk":{"body":{"stem":"Неліктен құстар мен сүтқоректілердің жүрегінде артерия және вена қаны араласпайды?","options":["Жүректе жүрекшелер жоқ","Оларда бір ғана қан айналым шеңбері бар","Перде жүректі оң және сол жартыға бөледі","Қан тек өкпе капиллярларында араласады"]},"answer":{"correct":2},"explanation":"Жүректің оң жартысында вена қаны, сол жартысында артерия қаны болады; перде оларды бөледі. Қосмекенділердің ортақ қарыншасында қан аралас."}}},{"id":"bio8-23-c01","topic_id":"bio8-23","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"95"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Какая это камера сердца? Из этой камеры кровь выталкивается в аорту.","options":["Правое предсердие","Правый желудочек","Левое предсердие","Левый желудочек"]},"answer":{"correct":3},"explanation":"Это левый желудочек: здесь начинается большой круг."},"kk":{"body":{"stem":"Бұл жүректің қай бөлігі? Бұл бөліктен қан қолқаға айдалады.","options":["Оң жақ жүрекше","Оң жақ қарынша","Сол жақ жүрекше","Сол жақ қарынша"]},"answer":{"correct":3},"explanation":"Бұл — сол жақ қарынша: үлкен шеңбер осыдан басталады."}}},{"id":"bio8-23-c02","topic_id":"bio8-23","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"95"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Какая это камера сердца? Сюда по верхней и нижней полым венам приходит венозная кровь от органов тела.","options":["Правое предсердие","Правый желудочек","Левое предсердие","Левый желудочек"]},"answer":{"correct":0},"explanation":"Это правое предсердие: здесь заканчивается большой круг."},"kk":{"body":{"stem":"Бұл жүректің қай бөлігі? Мұнда жоғарғы және төменгі қуыс веналармен дене мүшелерінен вена қаны келеді.","options":["Оң жақ жүрекше","Оң жақ қарынша","Сол жақ жүрекше","Сол жақ қарынша"]},"answer":{"correct":0},"explanation":"Бұл — оң жақ жүрекше: үлкен шеңбер осында аяқталады."}}},{"id":"bio8-23-c03","topic_id":"bio8-23","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"95"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Какая это камера сердца? Из этой камеры выходит лёгочная артерия, несущая венозную кровь.","options":["Правое предсердие","Правый желудочек","Левое предсердие","Левый желудочек"]},"answer":{"correct":1},"explanation":"Это правый желудочек: здесь начинается малый круг."},"kk":{"body":{"stem":"Бұл жүректің қай бөлігі? Бұл бөліктен вена қаны бар өкпе артериясы шығады.","options":["Оң жақ жүрекше","Оң жақ қарынша","Сол жақ жүрекше","Сол жақ қарынша"]},"answer":{"correct":1},"explanation":"Бұл — оң жақ қарынша: кіші шеңбер осыдан басталады."}}},{"id":"bio8-23-c04","topic_id":"bio8-23","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"95"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Какая это камера сердца? Сюда по лёгочным венам приходит кровь, насыщенная кислородом.","options":["Правое предсердие","Правый желудочек","Левое предсердие","Левый желудочек"]},"answer":{"correct":2},"explanation":"Это левое предсердие: здесь заканчивается малый круг."},"kk":{"body":{"stem":"Бұл жүректің қай бөлігі? Мұнда өкпе веналарымен оттекке қаныққан қан келеді.","options":["Оң жақ жүрекше","Оң жақ қарынша","Сол жақ жүрекше","Сол жақ қарынша"]},"answer":{"correct":2},"explanation":"Бұл — сол жақ жүрекше: кіші шеңбер осында аяқталады."}}},{"id":"bio8-23-c05","topic_id":"bio8-23","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"95"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Какая это камера сердца? У этой камеры самая толстая и мощная мышечная стенка в сердце.","options":["Правое предсердие","Правый желудочек","Левое предсердие","Левый желудочек"]},"answer":{"correct":3},"explanation":"Это левый желудочек — самый мощный отдел сердца: он гонит кровь по всему телу."},"kk":{"body":{"stem":"Бұл жүректің қай бөлігі? Бұл бөліктің бұлшық ет қабырғасы жүректегі ең қалың әрі мықты.","options":["Оң жақ жүрекше","Оң жақ қарынша","Сол жақ жүрекше","Сол жақ қарынша"]},"answer":{"correct":3},"explanation":"Бұл — сол жақ қарынша, жүректің ең мықты бөлігі: ол қанды бүкіл денеге айдайды."}}},{"id":"bio8-23-c06","topic_id":"bio8-23","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"95, 97"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Какая это камера сердца? Кровь в этой камере артериальная, а мышечная стенка у неё тонкая.","options":["Правое предсердие","Правый желудочек","Левое предсердие","Левый желудочек"]},"answer":{"correct":2},"explanation":"Это левое предсердие: артериальная кровь — у левой половины сердца, тонкая стенка — у предсердий."},"kk":{"body":{"stem":"Бұл жүректің қай бөлігі? Бұл бөліктегі қан — артерия қаны, ал бұлшық ет қабырғасы жұқа.","options":["Оң жақ жүрекше","Оң жақ қарынша","Сол жақ жүрекше","Сол жақ қарынша"]},"answer":{"correct":2},"explanation":"Бұл — сол жақ жүрекше: артерия қаны жүректің сол жартысында, жұқа қабырға жүрекшелерде болады."}}},{"id":"bio8-24-q01","topic_id":"bio8-24","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"99"},{"source_id":"src-bio8-kk","pages":"104"}],"versions":{"ru":{"body":{"stem":"Что такое гипотония?","options":["Повышение давления крови","Учащение ритма сердцебиения","Понижение давления крови","Образование жировых бляшек в сосудах"]},"answer":{"correct":2},"explanation":"Гипотония — понижение давления крови; повышение — гипертония, учащение сердцебиения — тахикардия, бляшки — атеросклероз."},"kk":{"body":{"stem":"Гипотония деген не?","options":["Қан қысымының жоғарылауы","Жүректің жиі соғуы","Қан қысымының төмендеуі","Тамырларда май шытыраларының түзілуі"]},"answer":{"correct":2},"explanation":"Гипотония — қан қысымының төмендеуі; жоғарылауы — гипертония, жүректің жиі соғуы — тахикардия, шытыралар — атеросклероз."}}},{"id":"bio8-24-q02","topic_id":"bio8-24","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"100"},{"source_id":"src-bio8-kk","pages":"106"}],"versions":{"ru":{"body":{"stem":"Что, по учебнику, чаще всего становится причиной инфаркта и ишемической болезни сердца?","options":["Гипотония","Атеросклероз","Тахикардия при физической нагрузке","Повышенная температура тела"]},"answer":{"correct":1},"explanation":"Жировые бляшки при атеросклерозе (и тромбы) закупоривают сосуды сердца, приток крови к миокарду прекращается."},"kk":{"body":{"stem":"Оқулық бойынша инфаркт пен жүректің ишемиялық ауруына көбінесе не себеп болады?","options":["Гипотония","Атеросклероз","Дене жүктемесі кезіндегі тахикардия","Дене қызуының көтерілуі"]},"answer":{"correct":1},"explanation":"Атеросклероз кезіндегі май шытыралары (және тромбтар) жүрек тамырларын бітейді, миокардқа қан келуі тоқтайды."}}},{"id":"bio8-24-q03","topic_id":"bio8-24","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"99"},{"source_id":"src-bio8-kk","pages":"105"}],"versions":{"ru":{"body":{"stem":"Выберите все признаки инфаркта миокарда, которые называет учебник.","options":["Боль всегда проходит за 1–2 минуты","Сильная боль за грудиной","Чувство страха","Боль только в животе после еды","Боль отдаёт в левую руку, плечо, шею"]},"answer":{"correct":[1,2,4]},"explanation":"Классический признак — сильная боль за грудиной, отдающая в левую руку, плечо, шею; часто страх. Приступ длится от 15 мин до нескольких часов."},"kk":{"body":{"stem":"Оқулықта аталған миокард инфарктының барлық белгісін таңдаңдар.","options":["Ауыру әрдайым 1–2 минутта басылады","Кеуде тұсының қатты ауыруы","Қорқыныш сезімі","Тек тамақтан кейін іштің ауыруы","Ауыру сол қолға, иыққа, мойынға таралады"]},"answer":{"correct":[1,2,4]},"explanation":"Негізгі белгісі — сол қолға, иыққа, мойынға таралатын кеуде тұсының қатты ауыруы; көбінесе қорқыныш. Ұстама 15 минуттан бірнеше сағатқа дейін созылады."}}},{"id":"bio8-24-q04","topic_id":"bio8-24","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"99–100"},{"source_id":"src-bio8-kk","pages":"105–106"}],"versions":{"ru":{"body":{"stem":"Соотнесите заболевание и его описание.","left":["Гипертония","Атеросклероз","Тромбоз","Тахикардия"],"right":["Повышение давления крови","Жировые бляшки в сосудах из-за нарушения жирового обмена","Сгусток крови в сосуде","Учащение ритма сердцебиения"],"display_order":[3,1,0,2]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Названия болезней подсказывают смысл: «гипер-» — повышение, «тахи-» — быстрый, «тромб» — сгусток крови."},"kk":{"body":{"stem":"Ауруды оның сипаттамасымен сәйкестендіріңдер.","left":["Гипертония","Атеросклероз","Тромбоз","Тахикардия"],"right":["Қан қысымының жоғарылауы","Май алмасуының бұзылуынан тамырлардағы май шытыралары","Тамырдағы қан ұйығы","Жүректің жиі соғуы"],"display_order":[3,1,0,2]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Аурулардың атауы мағынасын білдіреді: «гипер-» — жоғарылау, «тахи-» — жылдам, «тромб» — қан ұйығы."}}},{"id":"bio8-24-q05","topic_id":"bio8-24","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"100"},{"source_id":"src-bio8-kk","pages":"106"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку, как атеросклероз приводит к инфаркту.","items":["Нарушается жировой обмен","В крупных сосудах образуются жировые бляшки","Бляшка или тромб закупоривает более мелкий сосуд сердца","Прекращается приток крови к участку миокарда","Клетки сердечной мышцы без кислорода погибают"],"start":[2,4,0,3,1]},"answer":{"order":[0,1,2,3,4]},"explanation":"Причина → бляшки → закупорка → нет притока крови → омертвение участка сердечной мышцы (инфаркт)."},"kk":{"body":{"stem":"Атеросклероздың инфарктқа қалай әкелетінін ретімен орналастырыңдар.","items":["Май алмасуы бұзылады","Ірі тамырларда май шытыралары түзіледі","Шытыра немесе тромб жүректің ұсақ тамырын бітейді","Миокардтың бір бөлігіне қан келуі тоқтайды","Оттексіз жүрек бұлшық етінің жасушалары тіршілігін жояды"],"start":[2,4,0,3,1]},"answer":{"order":[0,1,2,3,4]},"explanation":"Себеп → шытыралар → бітелу → қан келмейді → жүрек бұлшық етінің бір бөлігі семеді (инфаркт)."}}},{"id":"bio8-24-q06","topic_id":"bio8-24","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"99–100"},{"source_id":"src-bio8-kk","pages":"105–106"}],"versions":{"ru":{"body":{"template":"Кровоизлияние в мозг или нарушение его кровоснабжения называют {{1}}, а омертвение участка сердечной мышцы — {{2}} миокарда.","choices":["инсультом","инфарктом","тромбозом","тахикардией"]},"answer":{"blanks":[0,1]},"explanation":"Инсульт поражает мозг, инфаркт — сердечную мышцу; общая причина часто одна — закупорка сосуда бляшкой или тромбом."},"kk":{"body":{"template":"Миға қан құйылуы немесе мидың қанмен қамтамасыз етілуінің бұзылуы — {{1}}, ал жүрек бұлшық етінің бір бөлігінің семуі — миокард {{2}}.","choices":["инсульт","инфаркты","тромбоз","тахикардия"]},"answer":{"blanks":[0,1]},"explanation":"Инсульт миды, инфаркт жүрек бұлшық етін зақымдайды; ортақ себебі көбінесе біреу — тамырдың шытырамен немесе тромбпен бітелуі."}}},{"id":"bio8-24-q07","topic_id":"bio8-24","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"100"},{"source_id":"src-bio8-kk","pages":"106"}],"versions":{"ru":{"body":{"stem":"У взрослого рядом с вами сильная боль за грудиной, отдающая в левую руку. Что нужно сделать в первую очередь?","options":["Подождать: боль может пройти сама","Предложить пройтись быстрым шагом","Дать ему свои таблетки от головной боли","Срочно вызвать «скорую помощь»"]},"answer":{"correct":3},"explanation":"При подозрении на инфаркт клетки сердечной мышцы погибают за 20–40 мин, поэтому сначала — срочно вызвать «скорую». Свои лекарства другому человеку давать нельзя."},"kk":{"body":{"stem":"Қасыңдағы ересек адамның кеуде тұсы қатты ауырып, ауыру сол қолға таралып тұр. Ең алдымен не істеу керек?","options":["Күту: ауыру өзі басылуы мүмкін","Жылдам жүріп көруді ұсыну","Өзіңнің бас ауруына арналған дәріңді беру","Тез арада «Жедел жәрдем» шақыру"]},"answer":{"correct":3},"explanation":"Инфарктқа күдік болғанда жүрек бұлшық етінің жасушалары 20–40 минутта тіршілігін жояды, сондықтан алдымен — тез арада «Жедел жәрдем» шақыру. Өз дәріңді басқа адамға беруге болмайды."}}},{"id":"bio8-24-q08","topic_id":"bio8-24","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"99"},{"source_id":"src-bio8-kk","pages":"105"}],"versions":{"ru":{"body":{"stem":"Каким прибором измеряют кровяное давление?","options":["Тонометром","Электрокардиографом","Термометром","Микроскопом"]},"answer":{"correct":0},"explanation":"Давление измеряют механическим или электронным тонометром. ЭКГ записывает работу сердца."},"kk":{"body":{"stem":"Қан қысымын қандай құралмен өлшейді?","options":["Тонометрмен","Электрокардиографпен","Термометрмен","Микроскоппен"]},"answer":{"correct":0},"explanation":"Қан қысымын механикалық немесе электрондық тонометрмен өлшейді. ЭКГ жүрек жұмысын жазады."}}},{"id":"bio8-24-q09","topic_id":"bio8-24","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"101"},{"source_id":"src-bio8-kk","pages":"106–107"}],"versions":{"ru":{"body":{"stem":"Что учебник относит к мерам профилактики заболеваний сердца и сосудов? Выберите все верные ответы.","options":["Чаще есть жирную и жареную пищу","Заниматься спортом или физкультурой","Есть свежие овощи и фрукты","Полностью отказаться от физических нагрузок","Избегать никотина и алкоголя"]},"answer":{"correct":[1,2,4]},"explanation":"Нагрузки нужны, но дозированные; жирное и жареное — ограничивать."},"kk":{"body":{"stem":"Оқулық жүрек-қан тамырлары ауруларының алдын алу шараларына нені жатқызады? Барлық дұрыс жауапты таңдаңдар.","options":["Майлы және қуырылған асты жиі жеу","Спортпен немесе денешынықтырумен шұғылдану","Көкөніс пен жеміс-жидек жеу","Дене жүктемесінен толық бас тарту","Никотин мен алкогольден аулақ болу"]},"answer":{"correct":[1,2,4]},"explanation":"Дене жүктемесі қажет, бірақ бақылаулы болуы керек; майлы және қуырылған асты шектеу керек."}}},{"id":"bio8-24-q10","topic_id":"bio8-24","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"101"},{"source_id":"src-bio8-kk","pages":"106"}],"versions":{"ru":{"body":{"stem":"Чем, по учебнику, бывают обусловлены заболевания сердечно-сосудистой системы?","options":["Только наследственностью","Наследственной предрасположенностью и образом жизни","Только образом жизни","Только инфекциями"]},"answer":{"correct":1},"explanation":"Учебник называет обе причины, поэтому здоровый образ жизни снижает риск, даже если есть наследственная предрасположенность."},"kk":{"body":{"stem":"Оқулық бойынша жүрек-қан тамырлары жүйесінің аурулары неге байланысты болуы мүмкін?","options":["Тек тұқым қуалаумен","Тұқым қуалайтын бейімділікпен және өмір салтымен","Тек өмір салтымен","Тек жұқпалармен"]},"answer":{"correct":1},"explanation":"Оқулық екі себепті де атайды, сондықтан тұқым қуалайтын бейімділік болса да, саламатты өмір салты қаупін азайтады."}}},{"id":"bio8-24-c01","topic_id":"bio8-24","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"99"},{"source_id":"src-bio8-kk","pages":"105"}],"versions":{"ru":{"body":{"stem":"Какое это заболевание? С возрастом стенки артерий теряют эластичность, артерии сужаются, и давление крови растёт.","options":["Гипотония","Гипертония","Инсульт","Инфаркт миокарда","Атеросклероз","Тахикардия"]},"answer":{"correct":1},"explanation":"Это гипертония — повышение давления крови."},"kk":{"body":{"stem":"Бұл қандай ауру? Жас ұлғайған сайын артерия қабырғалары созылғыштығын жоғалтып, артериялар тарылады, қан қысымы артады.","options":["Гипотония","Гипертония","Инсульт","Миокард инфаркты","Атеросклероз","Тахикардия"]},"answer":{"correct":1},"explanation":"Бұл — гипертония, қан қысымының жоғарылауы."}}},{"id":"bio8-24-c02","topic_id":"bio8-24","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"100"},{"source_id":"src-bio8-kk","pages":"106"}],"versions":{"ru":{"body":{"stem":"Какое это заболевание? Из-за нарушения жирового обмена в крупных сосудах образуются бляшки, мешающие току крови.","options":["Гипотония","Гипертония","Инсульт","Инфаркт миокарда","Атеросклероз","Тахикардия"]},"answer":{"correct":4},"explanation":"Это атеросклероз — самая частая причина инфаркта и ишемии."},"kk":{"body":{"stem":"Бұл қандай ауру? Май алмасуының бұзылуынан ірі тамырларда қан ағысына кедергі келтіретін шытыралар түзіледі.","options":["Гипотония","Гипертония","Инсульт","Миокард инфаркты","Атеросклероз","Тахикардия"]},"answer":{"correct":4},"explanation":"Бұл — атеросклероз, инфаркт пен ишемияның ең жиі себебі."}}},{"id":"bio8-24-c03","topic_id":"bio8-24","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"99–100"},{"source_id":"src-bio8-kk","pages":"105–106"}],"versions":{"ru":{"body":{"stem":"Какое это заболевание? Нарушено кровоснабжение мозга; у человека может нарушиться речь, память, развиться паралич.","options":["Гипотония","Гипертония","Инсульт","Инфаркт миокарда","Атеросклероз","Тахикардия"]},"answer":{"correct":2},"explanation":"Это инсульт: кровоизлияние в мозг или закупорка сосуда мозга."},"kk":{"body":{"stem":"Бұл қандай ауру? Мидың қанмен қамтамасыз етілуі бұзылған; адамның сөйлеуі, есте сақтауы бұзылып, сал ауруы дамуы мүмкін.","options":["Гипотония","Гипертония","Инсульт","Миокард инфаркты","Атеросклероз","Тахикардия"]},"answer":{"correct":2},"explanation":"Бұл — инсульт: миға қан құйылу немесе ми тамырының бітелуі."}}},{"id":"bio8-24-c04","topic_id":"bio8-24","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"99"},{"source_id":"src-bio8-kk","pages":"104"}],"versions":{"ru":{"body":{"stem":"Какое это заболевание? Давление крови понижено; одна из причин — малоподвижный образ жизни.","options":["Гипотония","Гипертония","Инсульт","Инфаркт миокарда","Атеросклероз","Тахикардия"]},"answer":{"correct":0},"explanation":"Это гипотония — понижение давления крови."},"kk":{"body":{"stem":"Бұл қандай ауру? Қан қысымы төмендеген; себептерінің бірі — аз қозғалу.","options":["Гипотония","Гипертония","Инсульт","Миокард инфаркты","Атеросклероз","Тахикардия"]},"answer":{"correct":0},"explanation":"Бұл — гипотония, қан қысымының төмендеуі."}}},{"id":"bio8-24-c05","topic_id":"bio8-24","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"100"},{"source_id":"src-bio8-kk","pages":"106"}],"versions":{"ru":{"body":{"stem":"Какое это заболевание? Сердце бьётся чаще обычного; у здорового человека так бывает при физической нагрузке или стрессе.","options":["Гипотония","Гипертония","Инсульт","Инфаркт миокарда","Атеросклероз","Тахикардия"]},"answer":{"correct":5},"explanation":"Это тахикардия — учащение ритма сердцебиения."},"kk":{"body":{"stem":"Бұл қандай ауру? Жүрек әдеттегіден жиі соғады; дені сау адамда бұл дене жүктемесі немесе күйзеліс кезінде болады.","options":["Гипотония","Гипертония","Инсульт","Миокард инфаркты","Атеросклероз","Тахикардия"]},"answer":{"correct":5},"explanation":"Бұл — тахикардия, жүректің жиі соғуы."}}},{"id":"bio8-24-c06","topic_id":"bio8-24","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"99"},{"source_id":"src-bio8-kk","pages":"105"}],"versions":{"ru":{"body":{"stem":"Какое это заболевание? Участок сердечной мышцы, оставшийся без кислорода, отмирает; появляется сильная боль за грудиной.","options":["Гипотония","Гипертония","Инсульт","Инфаркт миокарда","Атеросклероз","Тахикардия"]},"answer":{"correct":3},"explanation":"Это инфаркт миокарда: клетки сердечной мышцы без кислорода погибают за 20–40 мин."},"kk":{"body":{"stem":"Бұл қандай ауру? Оттексіз қалған жүрек бұлшық етінің бір бөлігі семеді; кеуде тұсы қатты ауырады.","options":["Гипотония","Гипертония","Инсульт","Миокард инфаркты","Атеросклероз","Тахикардия"]},"answer":{"correct":3},"explanation":"Бұл — миокард инфаркты: оттексіз жүрек бұлшық етінің жасушалары 20–40 минутта тіршілігін жояды."}}},{"id":"bio8-45-q01","topic_id":"bio8-45","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"177"},{"source_id":"src-bio8-kk","pages":"181"}],"versions":{"ru":{"body":{"stem":"Сколько дочерних клеток образуется из одной материнской клетки при митозе?","options":["1","2","4","8"]},"answer":{"correct":1},"explanation":"При митозе из 1 материнской клетки образуются 2 дочерние с тем же набором хромосом."},"kk":{"body":{"stem":"Митоз кезінде бір аналық жасушадан неше жас жасуша түзіледі?","options":["1","2","4","8"]},"answer":{"correct":1},"explanation":"Митоз кезінде бір аналық жасушадан хромосома саны бірдей екі жас жасуша түзіледі."}}},{"id":"bio8-45-q02","topic_id":"bio8-45","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"177"},{"source_id":"src-bio8-kk","pages":"181"}],"versions":{"ru":{"body":{"stem":"Клетка, вступившая в мейоз, содержит 50 хромосом. Сколько хромосом будет в каждой дочерней клетке?","options":["100","50","25","12"]},"answer":{"correct":2},"explanation":"При мейозе набор уменьшается в 2 раза: 50 : 2 = 25. Образуются 4 клетки по 25 хромосом."},"kk":{"body":{"stem":"Мейоз жолымен бөлінетін жасушада 50 хромосома бар. Әрбір жас жасушада неше хромосома болады?","options":["100","50","25","12"]},"answer":{"correct":2},"explanation":"Мейозда хромосома саны екі есе кемиді: 50 : 2 = 25. Әрқайсысында 25 хромосомадан 4 жасуша түзіледі."}}},{"id":"bio8-45-q03","topic_id":"bio8-45","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"178"},{"source_id":"src-bio8-kk","pages":"182"}],"versions":{"ru":{"body":{"stem":"В клетках тела человека 46 хромосом. Сколько хромосом в его половых клетках?","options":["92","46","23","12"]},"answer":{"correct":2},"explanation":"Гаметы образуются мейозом и гаплоидны: 46 : 2 = 23."},"kk":{"body":{"stem":"Адамның дене жасушаларында 46 хромосома бар. Оның жыныс жасушаларында неше хромосома болады?","options":["92","46","23","12"]},"answer":{"correct":2},"explanation":"Гаметалар мейоз арқылы түзіледі және гаплоидты: 46 : 2 = 23."}}},{"id":"bio8-45-q04","topic_id":"bio8-45","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"177"},{"source_id":"src-bio8-kk","pages":"181–182"}],"versions":{"ru":{"body":{"stem":"Что обеспечивает митоз? Выберите все верные ответы.","options":["Рост организма","Регенерацию — восстановление повреждённых частей","Образование гамет у человека","Бесполое размножение одноклеточных эукариот"]},"answer":{"correct":[0,1,3]},"explanation":"Митоз — основа роста, регенерации и бесполого размножения. Гаметы человека образуются мейозом."},"kk":{"body":{"stem":"Митоз нені қамтамасыз етеді? Барлық дұрыс жауапты таңдаңдар.","options":["Ағзаның өсуін","Регенерацияны — зақымдалған бөліктердің қалпына келуін","Адамда гаметалардың түзілуін","Біржасушалы эукариоттардың жыныссыз көбеюін"]},"answer":{"correct":[0,1,3]},"explanation":"Митоз — өсудің, регенерацияның және жыныссыз көбеюдің негізі. Адамның гаметалары мейоз арқылы түзіледі."}}},{"id":"bio8-45-q05","topic_id":"bio8-45","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"178"},{"source_id":"src-bio8-kk","pages":"182"}],"versions":{"ru":{"body":{"stem":"Соотнесите термин и определение.","left":["Гамета","Зигота","Диплоидный набор","Гаплоидный набор"],"right":["Половая клетка с гаплоидным набором хромосом","Оплодотворённая яйцеклетка, первая клетка зародыша","Двойной набор: у человека 46 хромосом в клетках тела","Одинарный набор: у человека 23 хромосомы в половых клетках"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Гамета — половая клетка (n), зигота — результат оплодотворения (2n). У человека 2n = 46, n = 23."},"kk":{"body":{"stem":"Терминді анықтамасымен сәйкестендіріңдер.","left":["Гамета","Зигота","Диплоидты жиынтық","Гаплоидты жиынтық"],"right":["Гаплоидты хромосома жиынтығы бар жыныс жасушасы","Ұрықтанған жұмыртқа жасушасы, ұрықтың алғашқы жасушасы","Адамның дене жасушаларында 46 хромосома","Адамның жыныс жасушаларында 23 хромосома"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Гамета — жыныс жасушасы (n), зигота — ұрықтану нәтижесі (2n). Адамда 2n = 46, n = 23."}}},{"id":"bio8-45-q06","topic_id":"bio8-45","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"178"},{"source_id":"src-bio8-kk","pages":"182"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку: как меняется число хромосом у человека от родителя к зародышу.","items":["Клетка половой железы: 46 хромосом","Мейоз","Гаметы: по 23 хромосомы","Оплодотворение: слияние гамет","Зигота: 46 хромосом","Митоз: клетки зародыша по 46 хромосом"],"start":[4,1,5,0,3,2]},"answer":{"order":[0,1,2,3,4,5]},"explanation":"Мейоз уменьшает набор вдвое (46 → 23), оплодотворение восстанавливает его (23 + 23 = 46), митоз сохраняет его в клетках зародыша."},"kk":{"body":{"stem":"Ретімен орналастырыңдар: адамда хромосома саны ата-анадан ұрыққа дейін қалай өзгереді.","items":["Жыныс безінің жасушасы: 46 хромосома","Мейоз","Гаметалар: 23 хромосомадан","Ұрықтану: гаметалардың қосылуы","Зигота: 46 хромосома","Митоз: ұрық жасушаларында 46 хромосомадан"],"start":[4,1,5,0,3,2]},"answer":{"order":[0,1,2,3,4,5]},"explanation":"Мейоз хромосома санын екі есе азайтады (46 → 23), ұрықтану оны қалпына келтіреді (23 + 23 = 46), митоз ұрық жасушаларында сақтайды."}}},{"id":"bio8-45-q07","topic_id":"bio8-45","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"177–178"},{"source_id":"src-bio8-kk","pages":"181–182"}],"versions":{"ru":{"body":{"template":"Митоз — основа {{1}} размножения, мейоз — основа {{2}} размножения.","choices":["бесполого","полового"]},"answer":{"blanks":[0,1]},"explanation":"Митоз даёт клетки тела и бесполое размножение, мейоз — гаметы для полового размножения."},"kk":{"body":{"template":"Митоз — {{1}} көбеюдің негізі, мейоз — {{2}} көбеюдің негізі.","choices":["жыныссыз","жыныстық"]},"answer":{"blanks":[0,1]},"explanation":"Митоз дене жасушаларын түзеді және жыныссыз көбеюді қамтамасыз етеді, мейоз — жыныстық көбеюге қажет гаметаларды."}}},{"id":"bio8-45-q08","topic_id":"bio8-45","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"178"},{"source_id":"src-bio8-kk","pages":"182"}],"versions":{"ru":{"body":{"stem":"Почему гаплоидная клетка не может делиться мейозом?","options":["Набор хромосом уже одинарный, уменьшить его вдвое нельзя","В гаплоидной клетке нет хромосом","Гаплоидные клетки вообще не делятся","Мейоз бывает только у растений"]},"answer":{"correct":0},"explanation":"По учебнику, меньше одного набора хромосом быть не может. Гаплоидные клетки могут делиться митозом."},"kk":{"body":{"stem":"Неліктен гаплоидты жасуша мейоз жолымен бөліне алмайды?","options":["Хромосома санын одан әрі екі есе азайту мүмкін емес","Гаплоидты жасушада хромосома болмайды","Гаплоидты жасушалар мүлдем бөлінбейді","Мейоз тек өсімдіктерде жүреді"]},"answer":{"correct":0},"explanation":"Оқулық бойынша хромосома жиынтығы біреуден кем болмайды. Гаплоидты жасушалар митоз жолымен бөліне алады."}}},{"id":"bio8-45-q09","topic_id":"bio8-45","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"178"},{"source_id":"src-bio8-kk","pages":"182"}],"versions":{"ru":{"body":{"stem":"Что такое зигота?","options":["Оплодотворённая яйцеклетка — первая клетка зародыша","Половая клетка с гаплоидным набором","Клетка, образовавшаяся амитозом","Спора гриба"]},"answer":{"correct":0},"explanation":"Зигота образуется при слиянии гамет и содержит диплоидный набор."},"kk":{"body":{"stem":"Зигота дегеніміз не?","options":["Ұрықтанған жұмыртқа жасушасы — ұрықтың алғашқы жасушасы","Гаплоидты жиынтығы бар жыныс жасушасы","Амитоз арқылы түзілген жасуша","Саңырауқұлақтың спорасы"]},"answer":{"correct":0},"explanation":"Зигота гаметалар қосылғанда түзіледі, онда диплоидты жиынтық болады."}}},{"id":"bio8-45-q10","topic_id":"bio8-45","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"179"},{"source_id":"src-bio8-kk","pages":"183"}],"versions":{"ru":{"body":{"stem":"В клетках тела организма 8 хромосом. Сколько хромосом будет в каждой клетке после митоза и после мейоза?","options":["8 и 4","4 и 8","8 и 8","16 и 4"]},"answer":{"correct":0},"explanation":"Митоз сохраняет число хромосом (8), мейоз уменьшает его вдвое (4). Задание составлено по № 4 рубрики «Применение» на с. 179."},"kk":{"body":{"stem":"Ағзаның дене жасушаларында 8 хромосома бар. Митоздан кейін және мейоздан кейін әр жасушада неше хромосома болады?","options":["8 және 4","4 және 8","8 және 8","16 және 4"]},"answer":{"correct":0},"explanation":"Митоз хромосома санын сақтайды (8), мейоз екі есе азайтады (4). Тапсырма 183-беттегі «Қолданылуы» бөлімінің 4-тапсырмасы негізінде құрастырылды."}}},{"id":"bio8-50-q01","topic_id":"bio8-50","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"197"},{"source_id":"src-bio8-kk","pages":"203"}],"versions":{"ru":{"body":{"stem":"Наследственность — это…","options":["свойство сохранять признаки предков и передавать их потомкам","свойство отличаться от родителей","приспособление к условиям среды","выживание лучше приспособленных организмов"]},"answer":{"correct":0},"explanation":"Свойство отличаться от родителей — это изменчивость, приспособление — адаптация, выживание приспособленных — естественный отбор."},"kk":{"body":{"stem":"Тұқымқуалаушылық дегеніміз…","options":["ата-тегінің белгілерін сақтап, ұрпаққа беру қасиеті","ата-аналарынан ерекшелену қасиеті","орта жағдайларына бейімделу","жақсы бейімделген ағзалардың тірі қалуы"]},"answer":{"correct":0},"explanation":"Ата-аналарынан ерекшелену — өзгергіштік, бейімделу — адаптация, жақсы бейімделгендердің тірі қалуы — табиғи сұрыпталу."}}},{"id":"bio8-50-q02","topic_id":"bio8-50","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"197"},{"source_id":"src-bio8-kk","pages":"204"}],"versions":{"ru":{"body":{"stem":"При какой изменчивости не меняются гены и хромосомы?","options":["Мутационной","Комбинативной","Модификационной","Наследственной"]},"answer":{"correct":2},"explanation":"Модификационная (ненаследственная) изменчивость не затрагивает ДНК, поэтому не передаётся потомкам."},"kk":{"body":{"stem":"Өзгергіштіктің қай түрінде гендер мен хромосомалар өзгермейді?","options":["Мутациялық","Үйлесімді (комбинативтік)","Модификациялық","Тұқым қуалайтын"]},"answer":{"correct":2},"explanation":"Модификациялық (тұқым қуаламайтын) өзгергіштікте ДНҚ өзгермейді, сондықтан ұрпаққа берілмейді."}}},{"id":"bio8-50-q03","topic_id":"bio8-50","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"197"},{"source_id":"src-bio8-kk","pages":"203–204"}],"versions":{"ru":{"body":{"stem":"Какие виды изменчивости относятся к наследственной? Выберите все верные ответы.","options":["Мутационная","Комбинативная","Модификационная"]},"answer":{"correct":[0,1]},"explanation":"Наследственная изменчивость делится на мутационную и комбинативную. Модификационная — ненаследственная."},"kk":{"body":{"stem":"Өзгергіштіктің қай түрлері тұқым қуалайтын өзгергіштікке жатады? Барлық дұрыс жауапты таңдаңдар.","options":["Мутациялық","Үйлесімді (комбинативтік)","Модификациялық"]},"answer":{"correct":[0,1]},"explanation":"Тұқым қуалайтын өзгергіштік мутациялық және үйлесімді болып бөлінеді. Модификациялық — тұқым қуаламайтын."}}},{"id":"bio8-50-q04","topic_id":"bio8-50","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"197–198"},{"source_id":"src-bio8-kk","pages":"204"}],"versions":{"ru":{"body":{"stem":"Соотнесите понятие и его описание.","left":["Мутационная изменчивость","Комбинативная изменчивость","Модификационная изменчивость","Адаптация"],"right":["Случайно меняется состав ДНК","Гены родителей и предков по-новому сочетаются у потомков","Признак меняется под действием среды, ДНК не меняется","Приспособление организма к условиям среды"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Мутация меняет ДНК, комбинация перемешивает уже имеющиеся гены, модификация не затрагивает ДНК. Адаптация — результат приспособления."},"kk":{"body":{"stem":"Ұғымды оның сипаттамасымен сәйкестендіріңдер.","left":["Мутациялық өзгергіштік","Үйлесімді өзгергіштік","Модификациялық өзгергіштік","Бейімделу"],"right":["ДНҚ құрамы кездейсоқ өзгереді","Ата-аналары мен арғы тегінің гендері ұрпақта жаңаша үйлеседі","Белгі орта әсерінен өзгереді, ДНҚ өзгермейді","Ағзаның орта жағдайларына бейімделуі"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Мутация ДНҚ-ны өзгертеді, үйлесім бар гендерді жаңаша біріктіреді, модификация ДНҚ-ға әсер етпейді. Бейімделу — ортаға икемделу нәтижесі."}}},{"id":"bio8-50-q05","topic_id":"bio8-50","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"198"},{"source_id":"src-bio8-kk","pages":"204"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку: как полезная окраска закрепляется в группе организмов.","items":["Случайная мутация дала особи новую окраску","Окраска делает особь незаметной для врагов — она выживает","Особь оставляет многочисленное потомство","Потомки тоже лучше защищены и оставляют больше потомства, чем иначе окрашенные сородичи","Через несколько поколений большая часть группы окрашена так же","Признак закрепляется в генофонде"],"start":[3,0,5,2,4,1]},"answer":{"order":[0,1,2,3,4,5]},"explanation":"Мутация создаёт признак, отбор сохраняет его носителей, и за несколько поколений признак распространяется в группе."},"kk":{"body":{"stem":"Ретімен орналастырыңдар: пайдалы түс ағзалар тобында қалай бекиді.","items":["Кездейсоқ мутация нәтижесінде дара жаңа түске ие болды","Бұл түс оны жауларынан жасырады — дара тірі қалады","Дара көптеген ұрпақ қалдырады","Ұрпақтары да жақсы қорғалған және басқа түсті туыстарынан көбірек ұрпақ қалдырады","Бірнеше ұрпақтан кейін топтың негізгі бөлігі осындай түсті болады","Белгі генофондта бекиді"],"start":[3,0,5,2,4,1]},"answer":{"order":[0,1,2,3,4,5]},"explanation":"Мутация белгіні туғызады, сұрыпталу оның иелерін сақтайды, бірнеше ұрпақта белгі топқа таралады."}}},{"id":"bio8-50-q06","topic_id":"bio8-50","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"199"},{"source_id":"src-bio8-kk","pages":"205"}],"versions":{"ru":{"body":{"template":"Наследственная изменчивость поставляет {{1}} для отбора, а естественный отбор «выбирает» из этих изменений наиболее {{2}} в данных условиях.","choices":["материал","выгодные","вредные","одинаковые"]},"answer":{"blanks":[0,1]},"explanation":"Без изменчивости отбору не из чего выбирать; отбор оставляет выгодные изменения."},"kk":{"body":{"template":"Тұқым қуалайтын өзгергіштік сұрыптау үшін алғашқы {{1}} жеткізеді, ал табиғи сұрыпталу одан орта жағдайына байланысты {{2}} іріктейді.","choices":["материалды","тиімділерін","зияндыларын","бірдейлерін"]},"answer":{"blanks":[0,1]},"explanation":"Өзгергіштік болмаса, сұрыптайтын ештеңе жоқ; сұрыпталу тиімді өзгерістерді қалдырады."}}},{"id":"bio8-50-q07","topic_id":"bio8-50","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"198"},{"source_id":"src-bio8-kk","pages":"205"}],"versions":{"ru":{"body":{"stem":"Почему, по учебнику, модификационная изменчивость не играет роли в эволюции?","options":["Она не передаётся следующим поколениям","Она возникает слишком редко","Она всегда вредна","Она бывает только у растений"]},"answer":{"correct":0},"explanation":"Модификации не затрагивают ДНК и не наследуются. При этом они помогают выжить при резкой смене условий."},"kk":{"body":{"stem":"Оқулық бойынша модификациялық өзгергіштіктің эволюцияда неге рөлі жоқ?","options":["Ол келесі ұрпақтарға берілмейді","Ол өте сирек кездеседі","Ол әрқашан зиянды","Ол тек өсімдіктерде болады"]},"answer":{"correct":0},"explanation":"Модификациялар ДНҚ-ға әсер етпейді және тұқым қуаламайды. Бірақ олар орта кенет өзгергенде тірі қалуға көмектеседі."}}},{"id":"bio8-50-q08","topic_id":"bio8-50","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"199"},{"source_id":"src-bio8-kk","pages":"203"}],"versions":{"ru":{"body":{"stem":"От кого, по учебнику, произошли все породы домашних голубей?","options":["От одного дикого предка","От нескольких разных диких видов","Каждая порода — от своего дикого предка","От скрещивания голубей с другими птицами"]},"answer":{"correct":0},"explanation":"Все породы голубей имеют одного дикого предка (рис. 103). Разнообразие пород — результат искусственного отбора на основе наследственной изменчивости."},"kk":{"body":{"stem":"Оқулық бойынша үй кептерлерінің барлық тұқымы кімнен таралған?","options":["Бір жабайы арғы тектен","Бірнеше түрлі жабайы түрден","Әр тұқым — өзінің жабайы арғы тегінен","Кептерлерді басқа құстармен будандастырудан"]},"answer":{"correct":0},"explanation":"Барлық кептерлер бір арғы тектен таралған (105-сурет). Тұқымдардың алуан түрлілігі — тұқым қуалайтын өзгергіштік негізіндегі қолдан сұрыптаудың нәтижесі."}}},{"id":"bio8-50-q09","topic_id":"bio8-50","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"199"},{"source_id":"src-bio8-kk","pages":"205"}],"versions":{"ru":{"body":{"stem":"Что Ч. Дарвин называл «главным фактором эволюции»?","options":["Отбор","Мутации","Модификации","Размножение"]},"answer":{"correct":0},"explanation":"Дарвин считал главным фактором отбор, но учебник подчёркивает: без наследственной изменчивости эволюция невозможна."},"kk":{"body":{"stem":"Ч. Дарвин нені эволюцияның негізгі факторы деп атады?","options":["Сұрыптауды","Мутацияларды","Модификацияларды","Көбеюді"]},"answer":{"correct":0},"explanation":"Дарвин сұрыптауды негізгі фактор деп санады, бірақ оқулықта тұқым қуалайтын өзгергіштіксіз эволюция жүрмейтіні айтылады."}}},{"id":"bio8-50-q10","topic_id":"bio8-50","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"197"},{"source_id":"src-bio8-kk","pages":"203"}],"versions":{"ru":{"body":{"stem":"Почему при половом размножении потомок не копирует ни одного из родителей?","options":["Он сочетает признаки двух родительских организмов","У него обязательно происходят мутации","На него действует только окружающая среда","При половом размножении гены не передаются"]},"answer":{"correct":0},"explanation":"Потомок получает признаки обоих родителей; их новое сочетание — основа комбинативной изменчивости."},"kk":{"body":{"stem":"Неліктен жынысты көбейгенде ұрпақ ата-анасының ешқайсысын толық қайталамайды?","options":["Ол екі ата-ананың белгілерін біріктіреді","Онда міндетті түрде мутация болады","Оған тек қоршаған орта әсер етеді","Жынысты көбейгенде гендер берілмейді"]},"answer":{"correct":0},"explanation":"Ұрпақ екі ата-ананың белгілерін алады; олардың жаңа үйлесімі — үйлесімді өзгергіштіктің негізі."}}},{"id":"bio8-50-c01","topic_id":"bio8-50","type":"single","subtype":"classify","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"198"},{"source_id":"src-bio8-kk","pages":"204"}],"versions":{"ru":{"body":{"stem":"Какой это вид изменчивости? У млекопитающих, живущих в холодном климате, шерсть гуще, чем у сородичей из тёплых мест. После переселения и линьки шерсть меняется.","options":["Мутационная","Комбинативная","Модификационная"]},"answer":{"correct":2},"explanation":"ДНК не меняется, признак зависит от среды и потомкам не передаётся."},"kk":{"body":{"stem":"Бұл өзгергіштіктің қай түрі? Суық климатта тіршілік ететін сүтқоректілердің жүні жылы жердегі туыстарына қарағанда қалың. Мекенін ауыстырып, түлегеннен кейін жүні өзгереді.","options":["Мутациялық","Үйлесімді (комбинативтік)","Модификациялық"]},"answer":{"correct":2},"explanation":"ДНҚ өзгермейді, белгі ортаға байланысты және ұрпаққа берілмейді."}}},{"id":"bio8-50-c02","topic_id":"bio8-50","type":"single","subtype":"classify","difficulty":2,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"198"},{"source_id":"src-bio8-kk","pages":"204"}],"versions":{"ru":{"body":{"stem":"Какой это вид изменчивости? В результате случайного изменения ДНК особь получила новую окраску, и её потомки тоже окрашены так.","options":["Мутационная","Комбинативная","Модификационная"]},"answer":{"correct":0},"explanation":"Случайно изменился состав ДНК, и признак передаётся потомкам — это мутация."},"kk":{"body":{"stem":"Бұл өзгергіштіктің қай түрі? ДНҚ-ның кездейсоқ өзгеруі нәтижесінде дара жаңа түске ие болды, оның ұрпақтары да осындай түсті.","options":["Мутациялық","Үйлесімді (комбинативтік)","Модификациялық"]},"answer":{"correct":0},"explanation":"ДНҚ құрамы кездейсоқ өзгерді және белгі ұрпаққа беріледі — бұл мутация."}}},{"id":"bio8-50-c03","topic_id":"bio8-50","type":"single","subtype":"classify","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"197"},{"source_ /* Pick N items: least-shown first, round-robin over topics, never two near-duplicates in one variant */
function pickItems(pool,n){
  const by={}; pool.forEach(x=>(by[x.topic_id]=by[x.topic_id]||[]).push(x));
  Object.keys(by).forEach(k=>{by[k]=rnd(by[k]).sort((a,b)=>(exp[a.id]||0)-(exp[b.id]||0));});
  const keys=rnd(Object.keys(by)), out=[], has=new Set(), skipped=[];
  const clash=id=>DUP.some(p=>p.includes(id)&&p.some(o=>o!==id&&has.has(o)));
  let progress=true;
  while(out.length<n&&progress){progress=false;
    for(const k of keys){if(out.length>=n) break; const q=by[k];
      while(q.length){const x=q.shift(); if(!clash(x.id)){out.push(x);has.add(x.id);progress=true;break;} skipped.push(x);}}}
  /* near-duplicates are only used when the pool has nothing else left */
  while(out.length<n&&skipped.length) out.push(skipped.shift());
  return rnd(out);
}
/* Option order is shuffled per attempt, except classifiers (fixed category list) and numeric scales */
function permFor(x){
  const v=x.versions.ru;
  if(!v.body.options||x.subtype==="classify"||v.body.options.every(o=>/^[\d~≈<>]/.test(o))) return null;
  return rnd(v.body.options.map((_,i)=>i));
}
function startSession(ids,mode){
  S={ids,mode,i:0,ans:{},checked:{},perm:{},started:Date.now(),limit:mode==="exam"?ids.length*SEC_PER_ITEM:0,done:false,timeUp:false};
  ids.forEach(id=>{S.perm[id]=permFor(BYID[id]); exp[id]=(exp[id]||0)+1;});
  save(); askFinish=false; view="run"; render(); startTimer();
}
function startTimer(){
  clearInterval(timerId); if(!S||S.mode!=="exam") return;
  timerId=setInterval(()=>{const left=S.limit-Math.floor((Date.now()-S.started)/1000);
    const el=$("#timer"); if(el){el.textContent=fmt(Math.max(0,left)); el.classList.toggle("low",left<=60);}
    if(left<=0){S.timeUp=true; finish();}},1000);
}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;

/* ---------- grading ---------- */
function complete(x,a){
  if(a==null) return false; const t=x.type, v=x.versions.ru;
  if(t==="single") return typeof a==="number";
  if(t==="multi") return a.length>0;
  if(t==="match") return a.length===v.body.left.length&&a.every(s=>s!==""&&s!=null);
  if(t==="order") return true;
  if(t==="fill") return a.length===v.answer.blanks.length&&a.every(s=>s!==""&&s!=null);
}
function grade(x,a){
  if(!complete(x,a)) return false; const v=x.versions.ru, t=x.type;
  if(t==="single") return a===v.answer.correct;
  if(t==="multi"){const c=[].concat(v.answer.correct);return a.length===c.length&&c.every(i=>a.includes(i));}
  if(t==="match") return a.every((s,j)=>+s===j);
  if(t==="order") return a.every((s,j)=>s===j);
  if(t==="fill") return a.every((s,k)=>+s===v.answer.blanks[k]);
}
function curAns(x){ if(x.type==="order"&&S.ans[x.id]==null) return x.versions.ru.body.start.slice(); return S.ans[x.id]; }

/* answer -> readable text, for the error review */
function answerText(x,a,isKey){
  const v=V(x), b=v.body, t=x.type;
  if(isKey){a=t==="single"?v.answer.correct:t==="multi"?[].concat(v.answer.correct):t==="match"?b.left.map((_,j)=>j):t==="order"?b.items.map((_,j)=>j):v.answer.blanks;}
  if(a==null||(Array.isArray(a)&&!a.length)) return null;
  if(t==="single") return b.options[a];
  if(t==="multi") return a.map(i=>b.options[i]).join("; ");
  if(t==="match") return b.left.map((l,j)=>`${l} → ${a[j]===""||a[j]==null?"…":b.right[+a[j]]}`).join("; ");
  if(t==="order") return a.map((k,p)=>`${p+1}) ${b.items[k]}`).join(" ");
  if(t==="fill"){let k=0;return b.template.replace(/\{\{\d+\}\}/g,()=>{const s=a[k++];return s===""||s==null?"…":`«${b.choices[+s]}»`;});}
}

/* ---------- render ---------- */
function renderStatic(){
  document.documentElement.lang=lang==="ru"?"ru":"kk";
  document.querySelectorAll("[data-t]").forEach(el=>{const v=L()[el.dataset.t]; if(typeof v==="string") el.textContent=v;});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("#foot").textContent=L().foot(ITEMS.length);
}
function render(){ renderStatic(); if(view==="setup") renderSetup(); else if(view==="run") renderRun(); else renderResult(); }

function renderSetup(){
  const l=L(); wrongSet=wrongSet.filter(id=>BYID[id]);
  const pool=ITEMS.filter(x=>setup.topics.includes(x.topic_id)&&(setup.src==="all"||wrongSet.includes(x.id)));
  const counts=[5,10,15,20];
  const nEff=Math.min(setup.count==="all"?pool.length:setup.count,pool.length);
  const wrongInSel=ITEMS.filter(x=>setup.topics.includes(x.topic_id)&&wrongSet.includes(x.id)).length;
  if(setup.src==="wrong"&&!wrongSet.length) setup.src="all";
  const topicRows=DATA.topics.map(t=>{const its=ITEMS.filter(x=>x.topic_id===t.id); const seen=its.filter(x=>exp[x.id]).length;
    return `<label class="topic"><input type="checkbox" id="tp-${t.id}" value="${t.id}" ${setup.topics.includes(t.id)?"checked":""}><span><span class="t">§${t.paragraph}. ${esc(t.title[lang])}</span><br><span class="pg">${lang==="ru"?"с.":"б."} ${esc(t.pages[lang])}</span></span><span class="meta">${l.items(its.length)}<br>${l.seen(seen,its.length)}</span></label>`;}).join("");
  const histRows=hist.length?`<div style="overflow-x:auto"><table class="hist"><thead><tr><th>${l.thDate}</th><th>${l.thMode}</th><th>${l.thScore}</th><th>${l.thTopics}</th></tr></thead><tbody>`+
    hist.map(h=>`<tr><td class="n">${esc(h.date)}</td><td>${esc(l[h.mode])}</td><td class="n">${h.k}/${h.n}</td><td class="n">${h.topics.map(id=>"§"+(TOPIC[id]?TOPIC[id].paragraph:"?")).join(", ")}</td></tr>`).join("")+`</tbody></table></div>`:`<p class="hint">${l.histEmpty}</p>`;
  $("#app").innerHTML=`
  <form class="card" id="setup" novalidate>
    <h2>${l.setupH}</h2>
    <fieldset><legend class="lbl">${l.topicsL}</legend>${topicRows}</fieldset>
    <fieldset><legend class="lbl">${l.srcL}</legend><div class="seg">
      <label><input type="radio" name="src" id="src-all" value="all" ${setup.src==="all"?"checked":""}>${l.srcAll}</label>
      <label><input type="radio" name="src" id="src-wrong" value="wrong" ${setup.src==="wrong"?"checked":""} ${wrongInSel?"":"disabled"}>${l.srcWrong(wrongInSel)}</label></div></fieldset>
    <fieldset><legend class="lbl">${l.countL}</legend><div class="seg">
      ${counts.map(c=>`<label><input type="radio" name="count" id="cnt-${c}" value="${c}" ${setup.count===c?"checked":""}>${c}</label>`).join("")}
      <label><input type="radio" name="count" id="cnt-all" value="all" ${setup.count==="all"?"checked":""}>${l.all}</label></div></fieldset>
    <fieldset><legend class="lbl">${l.modeL}</legend><div class="seg">
      <label><input type="radio" name="mode" id="md-p" value="practice" ${setup.mode==="practice"?"checked":""}><span><strong>${l.modePractice}</strong> <span class="hint" style="display:inline">· ${l.modePracticeH}</span></span></label>
      <label><input type="radio" name="mode" id="md-e" value="exam" ${setup.mode==="exam"?"checked":""}><span><strong>${l.modeExam}</strong> <span class="hint" style="display:inline">· ${l.modeExamH}</span></span></label></div>
      ${setup.mode==="exam"?`<p class="hint">${l.timeNote(Math.round(nEff*SEC_PER_ITEM/60))}</p>`:""}</fieldset>
    <div class="row between">
      <span class="hint">${pool.length?l.inVar(nEff,pool.length):l.needTopic}</span>
      <button class="btn" type="submit" id="go" ${pool.length?"":"disabled"}>${l.start}</button>
    </div>
  </form>
  <section class="card">
    <div class="row between"><h2>${l.histH}</h2>${hist.length||wrongSet.length?`<button type="button" class="btn ghost" id="rs">${l.resetStats}</button>`:""}</div>
    ${askReset?`<div class="warnbox row between"><span>${l.resetAsk}</span><span class="row"><button type="button" class="btn" id="rs-y">${l.resetYes}</button><button type="button" class="btn ghost" id="rs-n">${l.resetNo}</button></span></div>`:""}
    ${histRows}
    <p class="hint">${l.storeNote}</p>
  </section>`;
  const f=$("#setup");
  f.addEventListener("change",e=>{const t=e.target;
    if(t.type==="checkbox") setup.topics=[...f.querySelectorAll("input[type=checkbox]:checked")].map(i=>i.value);
    if(t.name==="count") setup.count=t.value==="all"?"all":+t.value;
    if(t.name==="mode") setup.mode=t.value;
    if(t.name==="src") setup.src=t.value;
    store.set("trn-setup",setup); const id=t.id; renderSetup(); const el=document.getElementById(id); if(el) el.focus();});
  f.addEventListener("submit",e=>{e.preventDefault(); if(!pool.length) return; startSession(pickItems(pool,nEff).map(x=>x.id),setup.mode);});
  const rs=$("#rs"); if(rs) rs.addEventListener("click",()=>{askReset=true;renderSetup();$("#rs-n").focus();});
  const y=$("#rs-y"); if(y){y.addEventListener("click",()=>{hist=[];wrongSet=[];exp={};save();askReset=false;renderSetup();});
    $("#rs-n").addEventListener("click",()=>{askReset=false;renderSetup();});}
}

function qBody(x,a,show){
  const v=V(x), b=v.body, t=x.type, id=x.id, dis=show?"disabled":"";
  if(t==="single"||t==="multi"){
    const order=S.perm[id]||b.options.map((_,i)=>i), key=[].concat(x.versions.ru.answer.correct), sel=a==null?[]:[].concat(a);
    return `<div class="opts">`+order.map(j=>{let c=""; if(show){if(key.includes(j)) c="ok"; else if(sel.includes(j)) c="no";}
      return `<label class="opt ${c}"><input type="${t==="single"?"radio":"checkbox"}" name="q-${id}" id="o-${id}-${j}" value="${j}" ${sel.includes(j)?"checked":""} ${dis}><span>${esc(b.options[j])}</span></label>`;}).join("")+`</div>`;
  }
  if(t==="match"){
    return `<div class="match">`+b.left.map((lt,j)=>{const s=a&&a[j]!=null?String(a[j]):""; const st=show?(+s===j&&s!==""?"color:var(--good)":"color:var(--bad)"):"";
      return `<div class="mrow"><strong style="${st}">${esc(lt)}</strong><select id="m-${id}-${j}" data-j="${j}" ${dis}><option value="">${L().choose}</option>${b.display_order.map(k=>`<option value="${k}" ${s===String(k)?"selected":""}>${esc(b.right[k])}</option>`).join("")}</select></div>`;}).join("")+`</div>`;
  }
  if(t==="order"){
    const ord=a||b.start;
    return `<ol class="order">`+ord.map((k,p)=>`<li style="${show?(k===p?"border-color:var(--good)":"border-color:var(--bad)"):""}"><span>${esc(b.items[k])}</span><button type="button" aria-label="${L().up}" data-p="${p}" data-d="-1" ${show||p===0?"disabled":""}>↑</button><button type="button" aria-label="${L().down}" data-p="${p}" data-d="1" ${show||p===ord.length-1?"disabled":""}>↓</button></li>`).join("")+`</ol>`;
  }
  if(t==="fill"){
    let k=0; return `<p class="fill">`+b.template.split(/(\{\{\d+\}\})/).map(part=>{if(!/^\{\{\d+\}\}$/.test(part)) return esc(part); const n=k++; const s=a&&a[n]!=null?String(a[n]):"";
      return `<select id="f-${id}-${n}" data-k="${n}" ${dis} aria-label="${n+1}"><option value="">…</option>${b.choices.map((c,j)=>`<option value="${j}" ${s===String(j)?"selected":""}>${esc(c)}</option>`).join("")}</select>`;}).join("")+`</p>`;
  }
}
function readAns(x){
  const id=x.id, t=x.type, b=x.versions.ru.body;
  if(t==="single"){const c=document.querySelector(`input[name="q-${id}"]:checked`);return c?+c.value:null;}
  if(t==="multi") return [...document.querySelectorAll(`input[name="q-${id}"]:checked`)].map(c=>+c.value).sort((p,q)=>p-q);
  if(t==="match") return b.left.map((_,j)=>document.getElementById(`m-${id}-${j}`).value);
  if(t==="fill") return x.versions.ru.answer.blanks.map((_,k)=>document.getElementById(`f-${id}-${k}`).value);
  return S.ans[id];
}

function renderRun(){
  const l=L(), x=BYID[S.ids[S.i]], n=S.ids.length, id=x.id, practice=S.mode==="practice";
  const show=practice&&S.checked[id];
  const a=curAns(x), ok=show?grade(x,a):null;
  const dots=S.ids.map((qid,k)=>{const q=BYID[qid]; let c="";
    if(practice&&S.checked[qid]) c=grade(q,curAns(q))?"ok":"no"; else if(S.ans[qid]!=null&&complete(q,S.ans[qid])) c="ans";
    return `<button type="button" class="${c}" data-go="${k}" ${k===S.i?'aria-current="true"':""} aria-label="${l.qOf(k+1,n)}">${k+1}</button>`;}).join("");
  const left=S.mode==="exam"?Math.max(0,S.limit-Math.floor((Date.now()-S.started)/1000)):0;
  const unanswered=S.ids.filter(q=>!complete(BYID[q],S.ans[q])&&!(BYID[q].type==="order"&&S.ans[q]!=null)).length;
    const v=V(x), qt=x.type==="fill"?"":`<div class="qtext">${esc(v.body.stem)}</div>`;
  const fb=show?`<div class="fb ${ok?"ok":"no"}" id="fb" tabindex="-1">${ok?l.correct:l.wrong}${ok?"":` <span class="why"><strong>${l.right}:</strong> ${esc(answerText(x,null,true))}</span>`}<span class="why">${esc(v.explanation)} <span class="pg">${pages(x)}</span></span></div>`:"";
  let actions="";
  if(practice){
    actions=show?`<button type="button" class="btn" id="nx">${S.ids.some(q=>!S.checked[q])?l.next:l.results}</button>`:`<button type="button" class="btn" id="ck">${l.check}</button>`;
  }else{
    actions=`<button type="button" class="btn ghost" id="pv" ${S.i===0?"disabled":""}>${l.prev}</button>`+(S.i<n-1?`<button type="button" class="btn" id="nx">${l.next}</button>`:"")+`<button type="button" class="btn ${S.i<n-1?"ghost":""}" id="fin">${l.finish}</button>`;
  }
  $("#app").innerHTML=`
  <div class="bar"><div class="dots">${dots}</div>${S.mode==="exam"?`<span class="timer ${left<=60?"low":""}" id="timer" aria-live="off">${fmt(left)}</span>`:""}</div>
  <article class="card" id="qcard">
    <div class="qhead"><span>${l.qOf(S.i+1,n)} · ${l.types[typeKey(x)]} · §${TOPIC[x.topic_id].paragraph}</span><span class="tag">${l.origin}</span></div>
    ${qt}${qBody(x,a,show)}
    <p class="hint" id="inc" hidden>${l.incomplete}</p>
    ${fb}
    ${askFinish?`<div class="warnbox row between"><span>${l.finishAsk(unanswered)}</span><span class="row"><button type="button" class="btn" id="fy">${l.finishYes}</button><button type="button" class="btn ghost" id="fn">${l.finishNo}</button></span></div>`:""}
    <div class="row">${actions}</div>
  </article>`;
  const card=$("#qcard");
  card.addEventListener("change",()=>{ if(!show){S.ans[id]=readAns(x); refreshDots();} });
  card.querySelectorAll(".order button").forEach(btn=>btn.addEventListener("click",()=>{
    const p=+btn.dataset.p,d=+btn.dataset.d, ord=curAns(x).slice(); [ord[p],ord[p+d]]=[ord[p+d],ord[p]]; S.ans[id]=ord; renderRun();
    const nb=document.querySelector(`.order li:nth-child(${p+d+1}) button[data-d="${d}"]`); if(nb&&!nb.disabled) nb.focus();}));
  document.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{S.i=+b.dataset.go;askFinish=false;renderRun();}));
  const ck=$("#ck"); if(ck) ck.addEventListener("click",()=>{const aa=x.type==="order"?curAns(x):readAns(x); if(!complete(x,aa)){$("#inc").hidden=false;return;}
    S.ans[id]=aa; S.checked[id]=true; renderRun(); const f=$("#fb"); if(f) f.focus();});
  const nx=$("#nx"); if(nx) nx.addEventListener("click",()=>{
    if(practice){const nxt=S.ids.findIndex((q,k)=>k>S.i&&!S.checked[q]); const any=S.ids.findIndex(q=>!S.checked[q]); if(any<0){finish();return;} S.i=nxt>=0?nxt:any;}
    else S.i++; askFinish=false; renderRun(); window.scrollTo({top:0});});
  const pv=$("#pv"); if(pv) pv.addEventListener("click",()=>{S.i--;askFinish=false;renderRun();});
  const fin=$("#fin"); if(fin) fin.addEventListener("click",()=>{ if(unanswered){askFinish=true;renderRun();$("#fn").focus();} else finish(); });
  const fy=$("#fy"); if(fy){fy.addEventListener("click",finish); $("#fn").addEventListener("click",()=>{askFinish=false;renderRun();});}
}
function refreshDots(){
  document.querySelectorAll("[data-go]").forEach(b=>{const q=BYID[S.ids[+b.dataset.go]]; if(S.mode==="exam") b.classList.toggle("ans",complete(q,S.ans[q.id]));});
}

function finish(){
  if(!S||S.done) return; clearInterval(timerId); S.done=true;
  S.res={}; S.ids.forEach(id=>{const x=BYID[id]; const a=x.type==="order"&&S.ans[id]==null&&S.mode==="exam"?null:curAns(x); S.res[id]=a==null?false:grade(x,a); S.final=S.final||{}; S.final[id]=a;});
  S.ids.forEach(id=>{ if(S.res[id]) wrongSet=wrongSet.filter(w=>w!==id); else if(!wrongSet.includes(id)) wrongSet.push(id); });
  const k=S.ids.filter(id=>S.res[id]).length, d=new Date();
  hist.unshift({date:`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`,mode:S.mode,k,n:S.ids.length,topics:[...new Set(S.ids.map(id=>BYID[id].topic_id))]});
  save(); view="result"; render(); window.scrollTo({top:0});
}

function renderResult(){
  const l=L(), n=S.ids.length, k=S.ids.filter(id=>S.res[id]).length;
  const tids=[...new Set(S.ids.map(id=>BYID[id].topic_id))].sort();
  const per=tids.map(t=>{const ids=S.ids.filter(id=>BYID[id].topic_id===t); const r=ids.filter(id=>S.res[id]).length; return {t,r,n:ids.length,p:Math.round(100*r/ids.length)};});
  const weak=per.filter(p=>p.p<80);
  const wrong=S.ids.filter(id=>!S.res[id]);
  const errs=wrong.map(id=>{const x=BYID[id], v=V(x), tp=TOPIC[x.topic_id], ya=answerText(x,S.final[id],false);
    return `<div class="err"><div class="qhead"><span>§${tp.paragraph} · ${l.types[typeKey(x)]}</span><span class="pg">${pages(x)}</span></div>
      <div class="qtext" style="font-size:16px">${esc(x.type==="fill"?v.body.template.replace(/\{\{\d+\}\}/g,"___"):v.body.stem)}</div>
      <dl class="kv"><dt>${l.yours}</dt><dd class="no">${esc(ya==null?l.noAns:ya)}</dd><dt>${l.right}</dt><dd class="ok">${esc(answerText(x,null,true))}</dd></dl>
      <p class="hint" style="color:var(--ink)">${esc(v.explanation)}</p>
      <a href="${MODULE_URL[x.topic_id]}#notes" target="_blank" rel="noopener">${l.goNotes(x.notes_point,tp.paragraph)}</a></div>`;}).join("");
  $("#app").innerHTML=`
  <section class="card">
    ${S.timeUp?`<div class="warnbox">${l.timeUp}</div>`:""}
    <div class="row between" style="align-items:flex-end">
      <div><span class="lbl">${l.resH} · ${l[S.mode]}</span><span class="score">${k}/${n}</span><p class="hint">${l.resSub(k,n)}</p></div>
      <div class="row">${wrong.length?`<button type="button" class="btn" id="ag">${l.again}</button>`:""}<button type="button" class="btn ${wrong.length?"ghost":""}" id="nv">${l.newVar}</button><button type="button" class="btn ghost" id="ts">${l.toSetup}</button></div>
    </div>
  </section>
  <section class="card"><h3>${l.byTopic}</h3><div class="tbars">${per.map(p=>`<div class="tbar"><span>§${TOPIC[p.t].paragraph}. ${esc(TOPIC[p.t].title[lang])}</span><span class="v">${p.r}/${p.n}</span><div class="track"><div class="fillb" style="width:${p.p}%"></div></div></div>`).join("")}</div>
    <h3>${l.recH}</h3>${weak.length?`<ul class="hint" style="margin:0;padding-left:18px">${weak.map(p=>`<li>${esc(l.rec("§"+TOPIC[p.t].paragraph+". "+TOPIC[p.t].title[lang],p.p))} <a href="${MODULE_URL[p.t]}" target="_blank" rel="noopener">→</a></li>`).join("")}</ul>`:`<p class="hint">${l.recOk}</p>`}</section>
  <section class="card"><h3>${l.errH}</h3>${errs||`<p class="hint">${l.errNone}</p>`}</section>`;
  const ag=$("#ag"); if(ag) ag.addEventListener("click",()=>startSession(rnd(wrong),"practice"));
  $("#nv").addEventListener("click",()=>{const pool=ITEMS.filter(x=>setup.topics.includes(x.topic_id)); const nEff=Math.min(setup.count==="all"?pool.length:setup.count,pool.length); if(pool.length) startSession(pickItems(pool,nEff).map(x=>x.id),setup.mode); else {view="setup";render();}});
  $("#ts").addEventListener("click",()=>{view="setup";render();});
}

document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;store.set("trn-lang",lang);render();}));
render();
})();
</script>
