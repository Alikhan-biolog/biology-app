адағы су үлесі, 6–8% — дене массасындағы қан үлесі."}}},{"id":"bio8-17-q03","topic_id":"bio8-17","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"71"},{"source_id":"src-bio8-kk","pages":"76"}],"versions":{"ru":{"body":{"template":"Плазма на 90% состоит из {{1}}. Раствор солей с концентрацией 0,9%, как в плазме, называют {{2}} раствором.","choices":["воды","белков","физиологическим","насыщенным"]},"answer":{"blanks":[0,2]},"explanation":"В физиологическом растворе клетки крови сохраняют нормальное состояние — поэтому его и называют «физиологическим»."},"kk":{"body":{"template":"Плазманың 90%-ы — {{1}}. Плазмадағыдай концентрациясы 0,9% тұз ерітіндісін {{2}} ерітінді деп атайды.","choices":["су","нәруыз","физиологиялық","қаныққан"]},"answer":{"blanks":[0,2]},"explanation":"Физиологиялық ерітіндіде қан жасушаларының қалыпты күйі сақталады — сондықтан оны «физиологиялық» деп атайды."}}},{"id":"bio8-17-q04","topic_id":"bio8-17","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"71–73"},{"source_id":"src-bio8-kk","pages":"76–79"}],"versions":{"ru":{"body":{"stem":"Соотнесите часть крови и её главную функцию.","left":["Эритроциты","Лейкоциты","Тромбоциты","Плазма"],"right":["Перенос кислорода и углекислого газа","Защита от болезнетворных микроорганизмов","Участие в свёртывании крови","Перенос растворённых веществ и тепла"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Строение каждого вида клеток связано с функцией: гемоглобин эритроцитов переносит газы, подвижные лейкоциты защищают, тромбоциты нужны для свёртывания. Вода плазмы переносит вещества и тепло."},"kk":{"body":{"stem":"Қанның бөлігін оның негізгі қызметімен сәйкестендіріңдер.","left":["Эритроциттер","Лейкоциттер","Тромбоциттер","Плазма"],"right":["Оттек пен көмірқышқыл газын тасымалдау","Ауру тудыратын микроағзалардан қорғау","Қанның ұюына қатысу","Еріген заттар мен жылуды тасымалдау"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Әр жасуша түрінің құрылысы қызметіне байланысты: эритроциттердің гемоглобині газдарды тасымалдайды, қозғалғыш лейкоциттер қорғайды, тромбоциттер қан ұюына қажет. Плазмадағы су заттар мен жылуды тасымалдайды."}}},{"id":"bio8-17-q05","topic_id":"bio8-17","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"79"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку: как образуется тромб.","items":["Кровеносный сосуд повреждён","Образуются нити нерастворимого белка фибрина","Нити фибрина налипают на отверстие в сосуде","В сети нитей застревают эритроциты, затем другие клетки крови","Образуется красный кровяной сгусток — тромб"],"start":[3,0,4,2,1]},"answer":{"order":[0,1,2,3,4]},"explanation":"Сначала повреждение, затем нити фибрина, на которых задерживаются клетки. Тромб красный из-за эритроцитов; в норме он образуется за 3–4 минуты."},"kk":{"body":{"stem":"Ретімен орналастырыңдар: тромб қалай түзіледі.","items":["Қан тамыры жарақаттанады","Ерімейтін нәруыз — фибрин жіпшелері түзіледі","Фибрин жіпшелері тамырдың жарақаттанған жеріне жабысады","Жіпшелерге эритроциттер, сосын қанның басқа жасушалары тұрып қалады","Қызыл қан ұйығы — тромб түзіледі"],"start":[3,0,4,2,1]},"answer":{"order":[0,1,2,3,4]},"explanation":"Алдымен жарақат, сосын фибрин жіпшелері, оларға жасушалар тұрып қалады. Тромб эритроциттер есебінен қызыл; қалыпты жағдайда 3–4 минутта түзіледі."}}},{"id":"bio8-17-q06","topic_id":"bio8-17","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"72"},{"source_id":"src-bio8-kk","pages":"77"}],"versions":{"ru":{"body":{"stem":"Сколько, по учебнику, живут эритроциты человека?","options":["120 суток","8–11 суток","3–4 минуты","около 10 лет"]},"answer":{"correct":0},"explanation":"Эритроциты живут 120 суток. 8–11 суток — срок жизни тромбоцитов, 3–4 минуты — время образования тромба."},"kk":{"body":{"stem":"Оқулық бойынша адамның эритроциттері қанша уақыт тіршілік етеді?","options":["120 тәулік","8–11 тәулік","3–4 минут","10 жылдай"]},"answer":{"correct":0},"explanation":"Эритроциттер 120 тәулік тіршілік етеді. 8–11 тәулік — тромбоциттердің тіршілік мерзімі, 3–4 минут — тромбтың түзілу уақыты."}}},{"id":"bio8-17-q07","topic_id":"bio8-17","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"72–73"},{"source_id":"src-bio8-kk","pages":"77–79"}],"versions":{"ru":{"body":{"stem":"Какие клетки крови не имеют ядра? Выберите все верные ответы.","options":["Эритроциты","Тромбоциты","Лейкоциты"]},"answer":{"correct":[0,1]},"explanation":"Ядра нет у эритроцитов и тромбоцитов. Лейкоциты — клетки с ядром."},"kk":{"body":{"stem":"Қанның қай жасушаларында ядро жоқ? Барлық дұрыс жауапты таңдаңдар.","options":["Эритроциттер","Тромбоциттер","Лейкоциттер"]},"answer":{"correct":[0,1]},"explanation":"Эритроциттер мен тромбоциттерде ядро жоқ. Лейкоциттер — ядролы жасушалар."}}},{"id":"bio8-17-q08","topic_id":"bio8-17","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"77"}],"versions":{"ru":{"body":{"stem":"В анализе крови гемоглобин ниже нормы (норма 120–150 г/л). На какое состояние это указывает?","options":["Анемия (малокровие)","Гемофилия","Образование тромба","Усиление иммунитета"]},"answer":{"correct":0},"explanation":"Анемия — уменьшение количества гемоглобина, железа или эритроцитов. Учебник называет лечение: полноценное питание, железосодержащие препараты и продукты, витамин B12."},"kk":{"body":{"stem":"Қан талдауында гемоглобин қалыптан төмен (қалыпты мөлшері 120–150 г/л). Бұл қандай жағдайды көрсетеді?","options":["Анемия (қаназдық)","Гемофилия","Тромб түзілуі","Иммунитеттің күшеюі"]},"answer":{"correct":0},"explanation":"Анемия — гемоглобин, темір немесе эритроциттер мөлшерінің азаюы. Оқулықта емдеу жолы аталады: құнарлы тамақтану, құрамында темір бар препараттар мен өнімдер, B12 дәрумені."}}},{"id":"bio8-17-q09","topic_id":"bio8-17","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"79"}],"versions":{"ru":{"body":{"stem":"Почему на станциях переливания используют декальцинированную кровь (лишённую кальция)?","options":["Без солей кальция кровь не свёртывается и остаётся жидкой","Кальций разрушает эритроциты","Кальций вызывает анемию","Без кальция кровь лучше переносит кислород"]},"answer":{"correct":0},"explanation":"Соли кальция участвуют в свёртывании. Кровь, лишённая любого компонента свёртывания, не свёртывается."},"kk":{"body":{"stem":"Неліктен қан құю станцияларында кальцийсіздендірілген (кальцийінен айырылған) қан қолданылады?","options":["Кальций тұздарынсыз қан ұйымайды, сұйық күйінде қалады","Кальций эритроциттерді бұзады","Кальций анемия тудырады","Кальцийсіз қан оттекті жақсы тасымалдайды"]},"answer":{"correct":0},"explanation":"Кальций тұздары қанның ұюына қатысады. Ұю құрамбөліктерінің біреуінен айырылған қан ұйымайды."}}},{"id":"bio8-17-q10","topic_id":"bio8-17","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"78"}],"versions":{"ru":{"body":{"stem":"У ученика грипп — инфекционное заболевание. Количество каких клеток в его крови, скорее всего, увеличится?","options":["Лейкоцитов","Эритроцитов","Тромбоцитов","Ни одних: состав крови постоянен"]},"answer":{"correct":0},"explanation":"Лейкоциты защищают от болезнетворных микроорганизмов, и учебник отмечает, что их число растёт при инфекционных заболеваниях."},"kk":{"body":{"stem":"Оқушы тұмаумен — жұқпалы аурумен ауырып жатыр. Оның қанында қай жасушалардың саны артуы мүмкін?","options":["Лейкоциттердің","Эритроциттердің","Тромбоциттердің","Ешқайсысының: қан құрамы тұрақты"]},"answer":{"correct":0},"explanation":"Лейкоциттер ауру тудыратын микроағзалардан қорғайды; оқулықта олардың саны жұқпалы ауруларда артатыны айтылған."}}},{"id":"bio8-17-c01","topic_id":"bio8-17","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"72"},{"source_id":"src-bio8-kk","pages":"77"}],"versions":{"ru":{"body":{"stem":"Какая это клетка крови? Клетка без ядра в форме двояковогнутого диска; внутри — гемоглобин.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":0},"explanation":"Это эритроцит: форма диска и отсутствие ядра оставляют больше места для гемоглобина."},"kk":{"body":{"stem":"Бұл қанның қай жасушасы? Ядросы жоқ, екі жағынан иілген диск пішінді жасуша; ішінде — гемоглобин.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":0},"explanation":"Бұл — эритроцит: диск пішіні мен ядроның болмауы гемоглобинге көбірек орын береді."}}},{"id":"bio8-17-c02","topic_id":"bio8-17","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"78"}],"versions":{"ru":{"body":{"stem":"Какая это клетка крови? Передвигается с помощью ложноножек, как амёба, и может выходить из кровеносных сосудов.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":1},"explanation":"Это лейкоцит: подвижность позволяет ему добираться до микробов в тканях."},"kk":{"body":{"stem":"Бұл қанның қай жасушасы? Амеба сияқты жалған аяқтарымен қозғалады және қан тамырынан шыға алады.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":1},"explanation":"Бұл — лейкоцит: қозғалғыштығы оған ұлпалардағы микробтарға жетуге мүмкіндік береді."}}},{"id":"bio8-17-c03","topic_id":"bio8-17","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"79"}],"versions":{"ru":{"body":{"stem":"Какая это клетка крови? Мелкие пластинки без ядра, живут 8–11 суток и нужны для свёртывания крови.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":2},"explanation":"Это тромбоциты — кровяные пластинки."},"kk":{"body":{"stem":"Бұл қанның қай жасушасы? Ядросы жоқ ұсақ пластинкалар, 8–11 тәулік тіршілік етеді, қанның ұюына қажет.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":2},"explanation":"Бұл — тромбоциттер, қан пластинкалары."}}},{"id":"bio8-17-c04","topic_id":"bio8-17","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"72"},{"source_id":"src-bio8-kk","pages":"77"}],"versions":{"ru":{"body":{"stem":"Какая это клетка крови? Переносит кислород от лёгких к органам и углекислый газ — к лёгким.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":0},"explanation":"Газы переносит гемоглобин эритроцитов."},"kk":{"body":{"stem":"Бұл қанның қай жасушасы? Оттекті өкпеден мүшелерге, ал көмірқышқыл газын өкпеге тасымалдайды.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":0},"explanation":"Газдарды эритроциттердің гемоглобині тасымалдайды."}}},{"id":"bio8-17-c05","topic_id":"bio8-17","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"78"}],"versions":{"ru":{"body":{"stem":"Какая это клетка крови? Поглощает бактерий; если поглотит слишком много, может погибнуть.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":1},"explanation":"Так лейкоциты защищают организм от болезнетворных микроорганизмов."},"kk":{"body":{"stem":"Бұл қанның қай жасушасы? Бактерияларды сіңіреді; тым көп сіңірсе, тіршілігін жоюы мүмкін.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":1},"explanation":"Лейкоциттер ағзаны ауру тудыратын микроағзалардан осылай қорғайды."}}},{"id":"bio8-17-c06","topic_id":"bio8-17","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"73"},{"source_id":"src-bio8-kk","pages":"79"}],"versions":{"ru":{"body":{"stem":"Какая это клетка крови? Погибают в печени и селезёнке или при образовании кровяного сгустка — тромба.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":2},"explanation":"Это тромбоциты: участвуя в образовании тромба, они расходуются."},"kk":{"body":{"stem":"Бұл қанның қай жасушасы? Бауырда, көкбауырда немесе қан ұйығында — тромб түзілгенде тіршілігін жояды.","options":["Эритроцит","Лейкоцит","Тромбоцит"]},"answer":{"correct":2},"explanation":"Бұл — тромбоциттер: тромб түзуге қатысып, жұмсалады."}}},{"id":"bio8-18-q01","topic_id":"bio8-18","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"75"},{"source_id":"src-bio8-kk","pages":"81"}],"versions":{"ru":{"body":{"stem":"Кто разработал основы учения об иммунитете и получил за это Нобелевскую премию 1908 г.?","options":["И. И. Мечников и П. Эрлих","Л. Пастер и Р. Кох","Г. Мендель и Т. Морган","И. П. Павлов и И. М. Сеченов"]},"answer":{"correct":0},"explanation":"Мечников изучал фагоцитоз (клеточный иммунитет), Эрлих — антитела (гуморальный иммунитет). Вместе их работы дали единое учение об иммунитете."},"kk":{"body":{"stem":"Иммунитет туралы ілімнің негізін кім жасады және 1908 жылы Нобель сыйлығын алды?","options":["И. И. Мечников пен П. Эрлих","Л. Пастер мен Р. Кох","Г. Мендель мен Т. Морган","И. П. Павлов пен И. М. Сеченов"]},"answer":{"correct":0},"explanation":"Мечников фагоцитозды (жасушалық иммунитет), Эрлих антиденелерді (гуморальдық иммунитет) зерттеді. Олардың жұмысы иммунитет туралы біртұтас ілім берді."}}},{"id":"bio8-18-q02","topic_id":"bio8-18","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"76"},{"source_id":"src-bio8-kk","pages":"81"}],"versions":{"ru":{"body":{"stem":"Фагоцитоз — это…","options":["захват твёрдых частиц клеткой с помощью ложноножек","выработка антител лимфоцитами","свёртывание крови","перенос кислорода эритроцитами"]},"answer":{"correct":0},"explanation":"Фагоциты захватывают частицу ложноножками и переваривают её с помощью лизосом. Выработка антител — это гуморальный иммунитет."},"kk":{"body":{"stem":"Фагоцитоз дегеніміз…","options":["жасушаның қатты бөлшектерді жалған аяқтары арқылы ұстап алуы","лимфоциттердің антидене жасауы","қанның ұюы","эритроциттердің оттек тасымалдауы"]},"answer":{"correct":0},"explanation":"Фагоциттер бөлшекті жалған аяқтарымен ұстап, лизосома көмегімен қорытады. Антидене жасау — гуморальдық иммунитет."}}},{"id":"bio8-18-q03","topic_id":"bio8-18","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"76"},{"source_id":"src-bio8-kk","pages":"82"}],"versions":{"ru":{"body":{"template":"В ответ на чужеродные вещества — {{1}} — лимфоциты вырабатывают особые защитные белки — {{2}}.","choices":["антигены","антитела","гормоны","ферменты"]},"answer":{"blanks":[0,1]},"explanation":"Антиген — то, что чужое; антитело (anti — против) — белок, который организм делает против него."},"kk":{"body":{"template":"Ағзаға енген бөгде заттар — {{1}}. Оларға жауап ретінде лимфоциттер бөліп шығаратын ерекше нәруыздар — {{2}}.","choices":["антигендер","антиденелер","гормондар","ферменттер"]},"answer":{"blanks":[0,1]},"explanation":"Антиген — бөгде зат; антидене (anti — қарсы) — ағза оған қарсы жасайтын нәруыз."}}},{"id":"bio8-18-q04","topic_id":"bio8-18","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"77"},{"source_id":"src-bio8-kk","pages":"82"}],"versions":{"ru":{"body":{"stem":"Соотнесите тип лейкоцитов и его функцию (по табл. 3).","left":["Нейтрофилы","Моноциты","Лимфоциты","Эозинофилы"],"right":["Активный фагоцитоз в межклеточном пространстве и коже","Пожирают вредные частицы, часто вне кровяного русла","Вырабатывают антитела","Обезвреживают чужеродные белки и белки отмерших тканей"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Нейтрофилы и моноциты — фагоциты: первые работают в тканях и коже, вторые часто вне сосудов. Лимфоциты вырабатывают антитела, эозинофилы обезвреживают чужие белки."},"kk":{"body":{"stem":"Лейкоцит типін оның қызметімен сәйкестендіріңдер (3-кесте бойынша).","left":["Нейтрофилдер","Моноциттер","Лимфоциттер","Эозинофилдер"],"right":["Жасушааралық кеңістікте және теріде белсенді фагоцитоз","Зиянды бөлшектерді көбінесе қан арнасынан тыс жояды","Антидене жасайды","Бөтен нәруыздарды және өлі ұлпа нәруыздарын залалсыздандырады"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Нейтрофилдер мен моноциттер — фагоциттер: біріншісі ұлпалар мен теріде, екіншісі көбінесе тамырдан тыс жұмыс істейді. Лимфоциттер антидене жасайды, эозинофилдер бөтен нәруыздарды залалсыздандырады."}}},{"id":"bio8-18-q05","topic_id":"bio8-18","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"76"},{"source_id":"src-bio8-kk","pages":"81"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку: как фагоцит уничтожает микроба, попавшего в ранку с занозой.","items":["Фагоцит выходит из кровеносного сосуда в ткань","Фагоцит встречает микроба","Захватывает его ложноножками и обволакивает","Переваривает микроба в цитоплазме с помощью лизосом"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"Так выглядит воспаление на рис. 50: фагоциты выходят из сосуда к занозе, захватывают микробов и переваривают их."},"kk":{"body":{"stem":"Ретімен орналастырыңдар: фагоцит тікенмен кірген микробты қалай жояды.","items":["Фагоцит қан тамырынан ұлпаға шығады","Фагоцит микробты кездестіреді","Оны жалған аяқтарымен ұстап, қоршап алады","Микробты цитоплазмада лизосома көмегімен қорытады"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"51-суреттегі қабыну осылай жүреді: фагоциттер тамырдан тікенге қарай шығып, микробтарды ұстап, қорытады."}}},{"id":"bio8-18-q06","topic_id":"bio8-18","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"77"},{"source_id":"src-bio8-kk","pages":"83"}],"versions":{"ru":{"body":{"stem":"Где созревают Т-лимфоциты?","options":["В тимусе (вилочковой железе)","В красном костном мозге","В печени","В почках"]},"answer":{"correct":0},"explanation":"Все предшественники лимфоцитов образуются в красном костном мозге, но Т-лимфоциты дозревают в тимусе, а В-лимфоциты — в самом костном мозге."},"kk":{"body":{"stem":"Т-лимфоциттер қай жерде жетіледі?","options":["Айырша безде (тимуста)","Сүйек кемігінде","Бауырда","Бүйректе"]},"answer":{"correct":0},"explanation":"Лимфоциттердің барлық бастапқы жасушалары сүйек кемігінде түзіледі, бірақ Т-лимфоциттер айырша безде, ал В-лимфоциттер сүйек кемігінің өзінде жетіледі."}}},{"id":"bio8-18-q07","topic_id":"bio8-18","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"76"},{"source_id":"src-bio8-kk","pages":"82"}],"versions":{"ru":{"body":{"stem":"Какие клетки крови учебник относит к фагоцитам? Выберите все верные ответы.","options":["Нейтрофилы","Моноциты","Эритроциты","Тромбоциты"]},"answer":{"correct":[0,1]},"explanation":"Нейтрофилы (микрофаги) и моноциты (макрофаги) — главная фагоцитарная система. Эритроциты переносят газы, тромбоциты нужны для свёртывания."},"kk":{"body":{"stem":"Оқулық қанның қай жасушаларын фагоциттерге жатқызады? Барлық дұрыс жауапты таңдаңдар.","options":["Нейтрофилдер","Моноциттер","Эритроциттер","Тромбоциттер"]},"answer":{"correct":[0,1]},"explanation":"Нейтрофилдер (микрофагтар) мен моноциттер (макрофагтар) — негізгі фагоцитоздық жүйе. Эритроциттер газ тасымалдайды, тромбоциттер қан ұюына қажет."}}},{"id":"bio8-18-q08","topic_id":"bio8-18","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"77"},{"source_id":"src-bio8-kk","pages":"83"}],"versions":{"ru":{"body":{"stem":"Почему при повторном попадании того же возбудителя антитела против него появляются быстрее?","options":["В-лимфоциты быстро узнают возбудителя и размножаются, давая клетки, вырабатывающие антитела против него","Фагоциты научились «узнавать» этого возбудителя","Повторно попавший возбудитель всегда слабее","Антитела вырабатывают эритроциты"]},"answer":{"correct":0},"explanation":"Фагоциты возбудителя не узнают — это делают лимфоциты. Чем чаще антиген попадает в организм, тем быстрее появляются антитела; на этом основаны прививки."},"kk":{"body":{"stem":"Неліктен сол қоздырғыш қайта енгенде оған қарсы антиденелер тезірек пайда болады?","options":["В-лимфоциттер қоздырғышты тез танып, көбейеді және оған қарсы антидене жасайтын жасушаларды береді","Фагоциттер бұл қоздырғышты «тануды» үйренді","Қайта енген қоздырғыш әрқашан әлсіз","Антиденелерді эритроциттер жасайды"]},"answer":{"correct":0},"explanation":"Фагоциттер қоздырғышты танымайды — мұны лимфоциттер істейді. Антиген неғұрлым жиі енсе, антидене соғұрлым тез пайда болады; екпелер осыған негізделген."}}},{"id":"bio8-18-q09","topic_id":"bio8-18","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"78"},{"source_id":"src-bio8-kk","pages":"83–84"}],"versions":{"ru":{"body":{"stem":"Как ВИЧ НЕ передаётся? Выберите все верные ответы.","options":["При кашле и чихании","При рукопожатии","При укусах насекомых","При переливании непроверенной крови","Через общий шприц"]},"answer":{"correct":[0,1,2]},"explanation":"ВИЧ передаётся половым путём, через кровь (переливание, уколы, общий шприц) и от матери ребёнку. Бытовым и воздушно-капельным путём он не передаётся."},"kk":{"body":{"stem":"АИТВ қалай ЖҰҚПАЙДЫ? Барлық дұрыс жауапты таңдаңдар.","options":["Жөтелгенде және түшкіргенде","Қол алысқанда","Жәндіктер шаққанда","Тексерілмеген қан құйғанда","Ортақ шприц арқылы"]},"answer":{"correct":[0,1,2]},"explanation":"АИТВ жыныстық жолмен, қан арқылы (қан құю, укол, ортақ шприц) және анадан балаға жұғады. Тұрмыстық және ауа-тамшы жолымен жұқпайды."}}},{"id":"bio8-18-q10","topic_id":"bio8-18","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"78"},{"source_id":"src-bio8-kk","pages":"83"}],"versions":{"ru":{"body":{"stem":"Почему для больного СПИДом опасна любая инфекция?","options":["ВИЧ разрушает Т-лимфоциты, и защита организма ослабевает","ВИЧ разрушает эритроциты и вызывает анемию","ВИЧ останавливает свёртывание крови","ВИЧ заставляет вырабатывать слишком много антител"]},"answer":{"correct":0},"explanation":"Без Т-лимфоцитов иммунная защита слабеет — наступает иммунодефицит, и организм не справляется даже с обычными инфекциями."},"kk":{"body":{"stem":"Неліктен ЖИТС-пен ауыратын адамға кез келген жұқпа қауіпті?","options":["АИТВ Т-лимфоциттерді жояды, ағза қорғанышы әлсірейді","АИТВ эритроциттерді жойып, анемия тудырады","АИТВ қанның ұюын тоқтатады","АИТВ антиденелерді тым көп жасатады"]},"answer":{"correct":0},"explanation":"Т-лимфоциттерсіз иммундық қорғаныс әлсірейді — иммун тапшылығы пайда болады, ағза кәдімгі жұқпалармен де күресе алмайды."}}},{"id":"bio8-18-c01","topic_id":"bio8-18","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"76"},{"source_id":"src-bio8-kk","pages":"81"}],"versions":{"ru":{"body":{"stem":"Какая это клетка иммунитета? Захватывает микроба ложноножками, обволакивает и переваривает его с помощью лизосом.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":0},"explanation":"Это фагоцит: так происходит фагоцитоз."},"kk":{"body":{"stem":"Бұл иммунитеттің қай жасушасы? Микробты жалған аяқтарымен ұстап, қоршап алады да, лизосома көмегімен қорытады.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":0},"explanation":"Бұл — фагоцит: фагоцитоз осылай жүреді."}}},{"id":"bio8-18-c02","topic_id":"bio8-18","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"77"},{"source_id":"src-bio8-kk","pages":"83"}],"versions":{"ru":{"body":{"stem":"Какая это клетка иммунитета? Становится зрелым и готовым к работе в тимусе — вилочковой железе.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":1},"explanation":"В тимусе созревают Т-лимфоциты; отсюда и буква «Т»."},"kk":{"body":{"stem":"Бұл иммунитеттің қай жасушасы? Айырша безде (тимуста) жетіліп, жұмысқа дайын болады.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":1},"explanation":"Айырша безде (тимуста) Т-лимфоциттер жетіледі; «Т» әрпі де содан."}}},{"id":"bio8-18-c03","topic_id":"bio8-18","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"77"},{"source_id":"src-bio8-kk","pages":"83"}],"versions":{"ru":{"body":{"stem":"Какая это клетка иммунитета? Созревает в красном костном мозге и вырабатывает специфическое антитело на новый антиген.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":2},"explanation":"Это В-лимфоцит: он обеспечивает гуморальный иммунитет."},"kk":{"body":{"stem":"Бұл иммунитеттің қай жасушасы? Сүйек кемігінде жетіледі және жаңа антигенге арнайы антидене жасайды.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":2},"explanation":"Бұл — В-лимфоцит: ол гуморальдық иммунитетті қамтамасыз етеді."}}},{"id":"bio8-18-c04","topic_id":"bio8-18","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"76"},{"source_id":"src-bio8-kk","pages":"82"}],"versions":{"ru":{"body":{"stem":"Какая это клетка иммунитета? Пожирает бактерий и пылинки в лёгких, но не умеет «узнавать» конкретного возбудителя.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":0},"explanation":"Это фагоцит (нейтрофил или моноцит). Узнавать возбудителя умеют лимфоциты."},"kk":{"body":{"stem":"Бұл иммунитеттің қай жасушасы? Бактериялар мен өкпедегі тозаңды жояды, бірақ нақты қоздырғышты «тани» алмайды.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":0},"explanation":"Бұл — фагоцит (нейтрофил немесе моноцит). Қоздырғышты лимфоциттер таниды."}}},{"id":"bio8-18-c05","topic_id":"bio8-18","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"77"},{"source_id":"src-bio8-kk","pages":"83"}],"versions":{"ru":{"body":{"stem":"Какая это клетка иммунитета? При повторном попадании того же возбудителя быстро размножается, давая клетки, которые вырабатывают антитела именно против него.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":2},"explanation":"Это В-лимфоцит. Поэтому повторная встреча с возбудителем проходит легче — на этом основаны прививки."},"kk":{"body":{"stem":"Бұл иммунитеттің қай жасушасы? Сол қоздырғыш қайта енгенде тез көбейіп, дәл соған қарсы антидене жасайтын жасушаларды береді.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":2},"explanation":"Бұл — В-лимфоцит. Сондықтан қоздырғышпен қайта кездесу жеңілірек өтеді — екпелер осыған негізделген."}}},{"id":"bio8-18-c06","topic_id":"bio8-18","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"78"},{"source_id":"src-bio8-kk","pages":"83"}],"versions":{"ru":{"body":{"stem":"Какая это клетка иммунитета? Именно эти клетки разрушает ВИЧ, из-за чего наступает иммунодефицит.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":1},"explanation":"ВИЧ разрушает Т-лимфоциты, и защита организма ослабевает."},"kk":{"body":{"stem":"Бұл иммунитеттің қай жасушасы? Дәл осы жасушаларды АИТВ жояды, сондықтан иммун тапшылығы пайда болады.","options":["Фагоцит","Т-лимфоцит","В-лимфоцит"]},"answer":{"correct":1},"explanation":"АИТВ Т-лимфоциттерді жояды, ағза қорғанышы әлсірейді."}}},{"id":"bio8-20-q01","topic_id":"bio8-20","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"89"}],"versions":{"ru":{"body":{"stem":"На какие два вида делят естественный иммунитет?","options":["Врождённый и приобретённый","Активный и пассивный","Клеточный и гуморальный","Вакцинный и сывороточный"]},"answer":{"correct":0},"explanation":"Естественный иммунитет — врождённый и приобретённый. Активный и пассивный — это виды искусственного иммунитета."},"kk":{"body":{"stem":"Табиғи иммунитетті қандай екі түрге бөледі?","options":["Туа біткен және жүре пайда болған","Белсенді және енжар","Жасушалық және гуморальдық","Вакциналық және сарысулық"]},"answer":{"correct":0},"explanation":"Табиғи иммунитет — туа біткен және жүре пайда болған. Белсенді және енжар — жасанды иммунитеттің түрлері."}}},{"id":"bio8-20-q02","topic_id":"bio8-20","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Что такое вакцина?","options":["Убитый или ослабленный возбудитель либо его обезвреженные яды","Готовые антитела из крови животного","Антибиотик, убивающий бактерии","Лейкоциты донора"]},"answer":{"correct":0},"explanation":"Вакцина учит иммунную систему самой вырабатывать антитела. Готовые антитела — это лечебная сыворотка."},"kk":{"body":{"stem":"Вакцина дегеніміз не?","options":["Тіршілігі жойылған немесе әлсіздендірілген қоздырғыш не оның залалсыздандырылған уы","Жануар қанынан алынған дайын антиденелер","Бактерияларды жоятын антибиотик","Донордың лейкоциттері"]},"answer":{"correct":0},"explanation":"Вакцина иммундық жүйені антиденелерді өзі жасауға үйретеді. Дайын антиденелер — емдік сарысу."}}},{"id":"bio8-20-q03","topic_id":"bio8-20","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"У человека уже началась инфекционная болезнь. Что ему нужно ввести, чтобы сразу помочь организму?","options":["Лечебную сыворотку","Вакцину","Физиологический раствор","Ничего — сработает врождённый иммунитет"]},"answer":{"correct":0},"explanation":"Сыворотка содержит готовые антитела и действует сразу. Вакцине нужно время, чтобы организм сам выработал антитела, поэтому её вводят заранее."},"kk":{"body":{"stem":"Адамда жұқпалы ауру басталып кетті. Ағзаға бірден көмектесу үшін оған не енгізу керек?","options":["Емдік сарысуды","Вакцинаны","Физиологиялық ерітіндіні","Ештеңе — туа біткен иммунитет іске қосылады"]},"answer":{"correct":0},"explanation":"Сарысуда дайын антиденелер бар, ол бірден әсер етеді. Вакцинаға ағза антиденелерді өзі жасауы үшін уақыт керек, сондықтан оны алдын ала енгізеді."}}},{"id":"bio8-20-q04","topic_id":"bio8-20","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"89"}],"versions":{"ru":{"body":{"stem":"После каких болезней, по учебнику, человек обычно повторно ими не заболевает? Выберите все верные ответы.","options":["Корь","Краснуха","Ангина","Ветряная оспа"]},"answer":{"correct":[0,1,3]},"explanation":"После кори, краснухи, ветряной оспы и паротита остаётся естественный приобретённый иммунитет. К ангине он не развивается, к гриппу — ненадолго."},"kk":{"body":{"stem":"Оқулық бойынша қандай аурулардан кейін адам әдетте олармен қайта ауырмайды? Барлық дұрыс жауапты таңдаңдар.","options":["Қызылша","Қызамық","Баспа (ангина)","Желшешек"]},"answer":{"correct":[0,1,3]},"explanation":"Қызылша, қызамық, желшешек және паротиттен кейін табиғи жүре пайда болған иммунитет қалады. Баспаға ол дамымайды, тұмауға — аз уақытқа."}}},{"id":"bio8-20-q05","topic_id":"bio8-20","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"89–90"}],"versions":{"ru":{"body":{"stem":"Соотнесите вид иммунитета и то, как он возникает.","left":["Врождённый","Естественный приобретённый","Искусственный активный","Искусственный пассивный"],"right":["Передаётся по наследству, одинаков у всех людей","Возникает после перенесённой болезни","Возникает после введения вакцины","Возникает после введения лечебной сыворотки"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Это и есть схема 4: естественный иммунитет — врождённый и приобретённый, искусственный — активный (вакцина) и пассивный (сыворотка)."},"kk":{"body":{"stem":"Иммунитет түрін оның қалай пайда болатынымен сәйкестендіріңдер.","left":["Туа біткен","Табиғи жүре пайда болған","Жасанды белсенді","Жасанды енжар"],"right":["Тұқым қуалайды, барлық адамда бірдей","Аурумен ауырған соң пайда болады","Вакцина енгізгеннен кейін пайда болады","Емдік сарысу енгізгеннен кейін пайда болады"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Бұл — 4-сызба: табиғи иммунитет — туа біткен және жүре пайда болған, жасанды — белсенді (вакцина) және енжар (сарысу)."}}},{"id":"bio8-20-q06","topic_id":"bio8-20","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку: как после прививки возникает активный искусственный иммунитет.","items":["В организм вводят вакцину","Иммунные клетки «знакомятся» с возбудителем","Организм сам вырабатывает антитела против этого возбудителя","Появляется устойчивая защита: при встрече с настоящим возбудителем человек не заболевает"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"Механизм похож на естественный приобретённый иммунитет, только встреча с возбудителем безопасна: он убит, ослаблен или обезврежен."},"kk":{"body":{"stem":"Ретімен орналастырыңдар: екпеден кейін белсенді жасанды иммунитет қалай пайда болады.","items":["Ағзаға вакцина енгізіледі","Иммундық жасушалар қоздырғышпен «танысады»","Ағза осы қоздырғышқа қарсы антиденелерді өзі жасайды","Тұрақты қорғаныс пайда болады: нағыз қоздырғышпен кездескенде адам ауырмайды"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"Механизмі табиғи жүре пайда болған иммунитетке ұқсайды, тек қоздырғышпен кездесу қауіпсіз: ол жойылған, әлсіздендірілген немесе залалсыздандырылған."}}},{"id":"bio8-20-q07","topic_id":"bio8-20","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"template":"Лечебная сыворотка содержит {{1}} антитела, поэтому иммунитет после неё называют {{2}}.","choices":["готовые","пассивным","активным","врождённым"]},"answer":{"blanks":[0,1]},"explanation":"Антитела сыворотки организм не вырабатывает сам — он получает их готовыми. Они действуют недолго, поэтому иммунитет пассивный."},"kk":{"body":{"template":"Емдік сарысуда {{1}} антиденелер болады, сондықтан одан кейінгі иммунитет {{2}} деп аталады.","choices":["дайын","енжар","белсенді","туа біткен"]},"answer":{"blanks":[0,1]},"explanation":"Сарысу антиденелерін ағза өзі жасамайды — оларды дайын күйінде алады. Олар аз уақыт әсер етеді, сондықтан иммунитет енжар."}}},{"id":"bio8-20-q08","topic_id":"bio8-20","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"84–85"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Почему вакцину вводят здоровым людям заранее, а не в разгар болезни?","options":["Организму нужно время, чтобы самому выработать антитела","Вакцина действует только на детей","Вакцина содержит готовые антитела, которые быстро разрушаются","Больному вакцина не нужна, у него уже есть врождённый иммунитет"]},"answer":{"correct":0},"explanation":"Вакцина запускает выработку собственных антител, а на это нужно время. Для быстрой помощи больному вводят сыворотку с готовыми антителами."},"kk":{"body":{"stem":"Неліктен вакцинаны аурудың қызған шағында емес, сау адамдарға алдын ала енгізеді?","options":["Ағзаға антиденелерді өзі жасауы үшін уақыт керек","Вакцина тек балаларға әсер етеді","Вакцинада тез бұзылатын дайын антиденелер бар","Ауру адамға вакцина керек емес, оның туа біткен иммунитеті бар"]},"answer":{"correct":0},"explanation":"Вакцина өз антиденелерінің түзілуін іске қосады, оған уақыт керек. Ауру адамға тез көмек беру үшін дайын антиденелері бар сарысу енгізеді."}}},{"id":"bio8-20-q09","topic_id":"bio8-20","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Что верно для активного искусственного иммунитета? Выберите все верные ответы.","options":["Возникает после введения вакцины","Антитела вырабатывает сам организм","Защита устойчивая","В организм вводят готовые антитела","Передаётся по наследству"]},"answer":{"correct":[0,1,2]},"explanation":"Готовые антитела вводят с сывороткой — это пассивный иммунитет. По наследству передаётся врождённый иммунитет."},"kk":{"body":{"stem":"Белсенді жасанды иммунитетке не тән? Барлық дұрыс жауапты таңдаңдар.","options":["Вакцина енгізгеннен кейін пайда болады","Антиденелерді ағзаның өзі жасайды","Қорғаныс тұрақты","Ағзаға дайын антиденелер енгізіледі","Тұқым қуалайды"]},"answer":{"correct":[0,1,2]},"explanation":"Дайын антиденелер сарысумен енгізіледі — бұл енжар иммунитет. Тұқым қуалайтыны — туа біткен иммунитет."}}},{"id":"bio8-20-q10","topic_id":"bio8-20","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"85"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Из чего, по учебнику, готовят лечебную сыворотку?","options":["Из крови переболевшего человека или животного, у которого вызвали выработку антител","Из убитых или ослабленных возбудителей","Из эритроцитов донора","Из обезвреженных ядов возбудителя"]},"answer":{"correct":0},"explanation":"В такой крови уже есть готовые антитела против возбудителя. Убитые, ослабленные возбудители и обезвреженные яды — это вакцины."},"kk":{"body":{"stem":"Оқулық бойынша емдік сарысуды неден дайындайды?","options":["Ауырып жазылған адамның немесе антидене түзілуі туғызылған жануардың қанынан","Тіршілігі жойылған немесе әлсіздендірілген қоздырғыштардан","Донордың эритроциттерінен","Қоздырғыштың залалсыздандырылған уынан"]},"answer":{"correct":0},"explanation":"Мұндай қанда қоздырғышқа қарсы дайын антиденелер бар. Жойылған, әлсіздендірілген қоздырғыштар мен залалсыздандырылған у — вакциналар."}}},{"id":"bio8-20-c01","topic_id":"bio8-20","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"89"}],"versions":{"ru":{"body":{"stem":"Какой это вид иммунитета? Чумкой собак человек не заболевает, даже если ухаживает за больной собакой.","options":["Врождённый","Естественный приобретённый","Искусственный активный","Искусственный пассивный"]},"answer":{"correct":0},"explanation":"Это врождённый иммунитет: он есть у всех людей и одинаков у всех."},"kk":{"body":{"stem":"Бұл иммунитеттің қай түрі? Адам ауру итті күтсе де, ит обасымен ауырмайды.","options":["Туа біткен","Табиғи жүре пайда болған","Жасанды белсенді","Жасанды енжар"]},"answer":{"correct":0},"explanation":"Бұл — туа біткен иммунитет: ол барлық адамда бар және бәрінде бірдей."}}},{"id":"bio8-20-c02","topic_id":"bio8-20","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"89"}],"versions":{"ru":{"body":{"stem":"Какой это вид иммунитета? Мальчик в детстве переболел корью и больше ею не болеет.","options":["Врождённый","Естественный приобретённый","Искусственный активный","Искусственный пассивный"]},"answer":{"correct":1},"explanation":"Это естественный приобретённый иммунитет: он возник после перенесённой болезни."},"kk":{"body":{"stem":"Бұл иммунитеттің қай түрі? Бала кезінде қызылшамен ауырған ер бала онымен қайта ауырмайды.","options":["Туа біткен","Табиғи жүре пайда болған","Жасанды белсенді","Жасанды енжар"]},"answer":{"correct":1},"explanation":"Бұл — табиғи жүре пайда болған иммунитет: ол аурумен ауырған соң пайда болды."}}},{"id":"bio8-20-c03","topic_id":"bio8-20","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Какой это вид иммунитета? Ребёнку сделали прививку — ввели ослабленного возбудителя, и его организм сам начал вырабатывать антитела.","options":["Врождённый","Естественный приобретённый","Искусственный активный","Искусственный пассивный"]},"answer":{"correct":2},"explanation":"Это искусственный активный иммунитет: возник после вакцины, антитела организм делает сам."},"kk":{"body":{"stem":"Бұл иммунитеттің қай түрі? Балаға екпе жасалды — әлсіздендірілген қоздырғыш енгізілді, ағзасы антиденелерді өзі жасай бастады.","options":["Туа біткен","Табиғи жүре пайда болған","Жасанды белсенді","Жасанды енжар"]},"answer":{"correct":2},"explanation":"Бұл — жасанды белсенді иммунитет: вакцинадан кейін пайда болды, антиденелерді ағза өзі жасайды."}}},{"id":"bio8-20-c04","topic_id":"bio8-20","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Какой это вид иммунитета? У человека началась инфекционная болезнь, и ему ввели лечебную сыворотку с готовыми антителами.","options":["Врождённый","Естественный приобретённый","Искусственный активный","Искусственный пассивный"]},"answer":{"correct":3},"explanation":"Это искусственный пассивный иммунитет: антитела готовые, они действуют недолго."},"kk":{"body":{"stem":"Бұл иммунитеттің қай түрі? Адамда жұқпалы ауру басталды, оған дайын антиденелері бар емдік сарысу енгізілді.","options":["Туа біткен","Табиғи жүре пайда болған","Жасанды белсенді","Жасанды енжар"]},"answer":{"correct":3},"explanation":"Бұл — жасанды енжар иммунитет: антиденелер дайын, олар аз уақыт әсер етеді."}}},{"id":"bio8-20-c05","topic_id":"bio8-20","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"89"}],"versions":{"ru":{"body":{"stem":"Какой это вид иммунитета? Кошачий тиф людям не страшен — такая защита у всех людей с рождения.","options":["Врождённый","Естественный приобретённый","Искусственный активный","Искусственный пассивный"]},"answer":{"correct":0},"explanation":"Это врождённый («генетический») иммунитет."},"kk":{"body":{"stem":"Бұл иммунитеттің қай түрі? Мысық сүзегі адамдарға қауіпті емес — мұндай қорғаныс барлық адамда туғаннан бар.","options":["Туа біткен","Табиғи жүре пайда болған","Жасанды белсенді","Жасанды енжар"]},"answer":{"correct":0},"explanation":"Бұл — туа біткен («генетикалық») иммунитет."}}},{"id":"bio8-20-c06","topic_id":"bio8-20","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"84"},{"source_id":"src-bio8-kk","pages":"90"}],"versions":{"ru":{"body":{"stem":"Какой это вид иммунитета? Ввели обезвреженный яд возбудителя; через некоторое время в крови появились собственные антитела и устойчивая защита.","options":["Врождённый","Естественный приобретённый","Искусственный активный","Искусственный пассивный"]},"answer":{"correct":2},"explanation":"Это искусственный активный иммунитет: вакцина может содержать и обезвреженные яды возбудителя."},"kk":{"body":{"stem":"Бұл иммунитеттің қай түрі? Қоздырғыштың залалсыздандырылған уы енгізілді; біраз уақыттан кейін қанда өз антиденелері мен тұрақты қорғаныс пайда болды.","options":["Туа біткен","Табиғи жүре пайда болған","Жасанды белсенді","Жасанды енжар"]},"answer":{"correct":2},"explanation":"Бұл — жасанды белсенді иммунитет: вакцинада қоздырғыштың залалсыздандырылған уы да болуы мүмкін."}}},{"id":"bio8-21-q01","topic_id":"bio8-21","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"86"},{"source_id":"src-bio8-kk","pages":"91"}],"versions":{"ru":{"body":{"stem":"Что такое агглютиногены?","options":["Белки плазмы крови","Клетки памяти","Белки на поверхности эритроцитов","Ферменты свёртывания крови"]},"answer":{"correct":2},"explanation":"Агглютиногены — белки эритроцитов, по ним определяют группу крови. Белки плазмы, которые склеивают чужие эритроциты, — агглютинины."},"kk":{"body":{"stem":"Агглютиногендер дегеніміз не?","options":["Қан плазмасының нәруыздары","Жады жасушалары","Эритроциттер бетіндегі нәруыздар","Қан ұюының ферменттері"]},"answer":{"correct":2},"explanation":"Агглютиногендер — эритроцит нәруыздары, олар бойынша қан тобын анықтайды. Бөгде эритроциттерді жабыстыратын плазма нәруыздары — агглютининдер."}}},{"id":"bio8-21-q02","topic_id":"bio8-21","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"86"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Обладателю I группы нужна донорская кровь. Какую можно использовать по таблице 4?","options":["Только IV группы","Только I группы","I и IV групп","Любой группы"]},"answer":{"correct":1},"explanation":"I группа — универсальный донор: её кровь можно дать всем, но сама она принимает кровь только I группы."},"kk":{"body":{"stem":"I топ иесіне донор қаны керек. 4-кесте бойынша қайсысын қолдануға болады?","options":["Тек IV топ қанын","Тек I топ қанын","I және IV топ қанын","Кез келген топ қанын"]},"answer":{"correct":1},"explanation":"I топ — әмбебап донор: оның қанын бәріне беруге болады, бірақ өзі тек I топ қанын қабылдайды."}}},{"id":"bio8-21-q03","topic_id":"bio8-21","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"86"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Пациент с III группой ждёт переливания. Чья кровь для него годится?","options":["I или III","Любой группы","Только IV","II или III"]},"answer":{"correct":0},"explanation":"III группа принимает кровь своей группы и I. При этом сегодня переливают одногруппную кровь, а I группу — только в экстренных случаях и в небольшом количестве."},"kk":{"body":{"stem":"III топты науқас қан құюды күтіп отыр. Оған кімнің қаны жарайды?","options":["I немесе III","Кез келген топ","Тек IV","II немесе III"]},"answer":{"correct":0},"explanation":"III топ өз тобының және I топ қанын қабылдайды. Қазір өз тобының қанын құяды, ал I топты тек төтенше жағдайда және аз мөлшерде қолданады."}}},{"id":"bio8-21-q04","topic_id":"bio8-21","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"88"},{"source_id":"src-bio8-kk","pages":"93"}],"versions":{"ru":{"body":{"stem":"Что верно для резус-фактора? Выберите все верные ответы.","options":["Это белок плазмы, склеивающий эритроциты","У резус-отрицательных людей его нет","Это белок эритроцитов","Его учитывают при переливании крови","Он есть только у новорождённых"]},"answer":{"correct":[1,2,3]},"explanation":"Резус-фактор — белок на эритроцитах. Склеивают эритроциты белки плазмы — агглютинины."},"kk":{"body":{"stem":"Резус-факторға не тән? Барлық дұрыс жауапты таңдаңдар.","options":["Бұл — эритроциттерді жабыстыратын плазма нәруызы","Теріс резусты адамдарда ол жоқ","Бұл — эритроцит нәруызы","Қан құйғанда оны ескереді","Ол тек нәрестелерде болады"]},"answer":{"correct":[1,2,3]},"explanation":"Резус-фактор — эритроциттердегі нәруыз. Эритроциттерді плазма нәруыздары — агглютининдер жабыстырады."}}},{"id":"bio8-21-q05","topic_id":"bio8-21","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"87–88"},{"source_id":"src-bio8-kk","pages":"92–93"}],"versions":{"ru":{"body":{"stem":"Соотнесите термин и определение.","left":["Агглютинация","Агглютинин","Универсальный реципиент","Гемолитическая желтуха"],"right":["Склеивание эритроцитов при переливании крови не той группы","Белок плазмы, который склеивает чужие эритроциты","Человек с IV группой, которому можно перелить кровь любой группы","Разрушение эритроцитов новорождённого антителами матери при резус-конфликте"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Агглютинины плазмы вызывают агглютинацию. IV группа — универсальный реципиент. Гемолитическая желтуха — следствие резус-конфликта."},"kk":{"body":{"stem":"Терминді анықтамасымен сәйкестендіріңдер.","left":["Агглютинация","Агглютинин","Әмбебап реципиент","Гемолиздік сарыауру"],"right":["Тобы сәйкес келмейтін қан құйғанда эритроциттердің жабысуы","Бөгде эритроциттерді жабыстыратын плазма нәруызы","Кез келген топ қанын құюға болатын IV топты адам","Резус-конфликт кезінде нәресте эритроциттерінің ана антиденелерімен бұзылуы"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"Плазма агглютининдері агглютинация тудырады. IV топ — әмбебап реципиент. Гемолиздік сарыауру — резус-конфликттің салдары."}}},{"id":"bio8-21-q06","topic_id":"bio8-21","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"88"},{"source_id":"src-bio8-kk","pages":"93"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку: как развивается резус-конфликт.","items":["Резус-отрицательная мать вынашивает резус-положительного ребёнка","В первую беременность опасного количества антител обычно не образуется","В организме матери сохраняются клетки памяти (В-лимфоциты)","Во вторую беременность резус-положительным ребёнком антитела матери разрушают его эритроциты — возможна гемолитическая желтуха"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"Поэтому опасна обычно не первая, а повторная беременность резус-положительным ребёнком. Современная медицина умеет это предотвращать."},"kk":{"body":{"stem":"Ретімен орналастырыңдар: резус-конфликт қалай дамиды.","items":["Теріс резусты ана оң резусты бала көтереді","Бірінші жүктілікте қауіпті мөлшерде антидене әдетте түзілмейді","Ана ағзасында жады жасушалары (В-лимфоциттер) сақталады","Оң резусты баламен екінші жүктілікте ана антиденелері оның эритроциттерін бұзады — гемолиздік сарыауру болуы мүмкін"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"Сондықтан әдетте бірінші емес, оң резусты баламен қайталанған жүктілік қауіпті. Заманауи медицина мұның алдын ала алады."}}},{"id":"bio8-21-q07","topic_id":"bio8-21","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"87"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"template":"Переливание крови не той группы вызывает {{1}} — склеивание эритроцитов. Его вызывают белки {{2}} реципиента.","choices":["агглютинацию","плазмы","свёртывание","эритроцитов"]},"answer":{"blanks":[0,1]},"explanation":"Белки плазмы (агглютинины) реагируют на чужие эритроциты как на антиген и склеивают их."},"kk":{"body":{"template":"Тобы сәйкес келмейтін қанды құю {{1}} — эритроциттердің жабысуын тудырады. Оны реципиенттің {{2}} нәруыздары тудырады.","choices":["агглютинацияны","плазмасының","ұюды","эритроциттерінің"]},"answer":{"blanks":[0,1]},"explanation":"Плазма нәруыздары (агглютининдер) бөгде эритроциттерге антигенге әсер еткендей әсер етіп, оларды жабыстырады."}}},{"id":"bio8-21-q08","topic_id":"bio8-21","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"87"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Почему агглютинация смертельно опасна?","options":["Кровь перестаёт свёртываться","Лейкоциты перестают делиться","Склеенные эритроциты не переносят кислород и образуют в крови мелкие сгустки","В крови резко увеличивается число эритроцитов"]},"answer":{"correct":2},"explanation":"Агглютинация развивается очень быстро: склеенные эритроциты выходят из строя и закупоривают мелкие сосуды сгустками."},"kk":{"body":{"stem":"Неліктен агглютинация өте қауіпті?","options":["Қан ұюын тоқтатады","Лейкоциттер бөлінуін тоқтатады","Жабысқан эритроциттер оттекті тасымалдай алмайды және қанда ұсақ қанұйықтар түзеді","Қанда эритроциттер саны күрт көбейеді"]},"answer":{"correct":2},"explanation":"Агглютинация өте тез дамиды: жабысқан эритроциттер қызметін атқара алмайды және ұсақ қанұйықтар түзеді."}}},{"id":"bio8-21-q09","topic_id":"bio8-21","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"88"},{"source_id":"src-bio8-kk","pages":"93"}],"versions":{"ru":{"body":{"stem":"При каком сочетании возможен резус-конфликт?","options":["Мать резус-положительная, ребёнок резус-отрицательный","Мать резус-отрицательная, ребёнок резус-положительный","Мать и ребёнок резус-отрицательные","Мать и ребёнок резус-положительные"]},"answer":{"correct":1},"explanation":"Антитела образуются у матери, у которой резус-фактора нет, против эритроцитов ребёнка, у которого он есть."},"kk":{"body":{"stem":"Қандай жағдайда резус-конфликт болуы мүмкін?","options":["Анасы оң резусты, баласы теріс резусты","Анасы теріс резусты, баласы оң резусты","Анасы да, баласы да теріс резусты","Анасы да, баласы да оң резусты"]},"answer":{"correct":1},"explanation":"Антиденелер резус-факторы жоқ анада, резус-факторы бар бала эритроциттеріне қарсы түзіледі."}}},{"id":"bio8-21-q10","topic_id":"bio8-21","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"88"},{"source_id":"src-bio8-kk","pages":"93"}],"versions":{"ru":{"body":{"stem":"Почему даже кровь своей группы переливают небольшими порциями, наблюдая за больным?","options":["Так экономят донорскую кровь","Донорская кровь быстро свёртывается в пакете","Возможна индивидуальная непереносимость других белков и клеток донорской крови","Своя группа крови тоже всегда вызывает агглютинацию"]},"answer":{"correct":2},"explanation":"Кроме агглютиногенов, в крови есть тромбоциты, лейкоциты и много белков плазмы — на них возможна иммунная реакция."},"kk":{"body":{"stem":"Неліктен өз тобының қанын да аз мөлшерде, науқасты бақылап құяды?","options":["Солай донор қанын үнемдейді","Донор қаны пакетте тез ұйиды","Донор қанының басқа нәруыздары мен жасушаларына жеке төзбеу болуы мүмкін","Өз тобының қаны да әрқашан агглютинация тудырады"]},"answer":{"correct":2},"explanation":"Агглютиногендерден басқа қанда тромбоциттер, лейкоциттер және плазма нәруыздарының көп мөлшері бар — оларға иммундық реакция болуы мүмкін."}}},{"id":"bio8-21-c01","topic_id":"bio8-21","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"86"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Какая это группа крови? Людей с этой группой называют универсальными донорами.","options":["I группа","II группа","III группа","IV группа"]},"answer":{"correct":0},"explanation":"Это I группа: по таблице 4 её кровь подходит группам I, II, III и IV."},"kk":{"body":{"stem":"Бұл қай қан тобы? Бұл топтағы адамдарды әмбебап донорлар деп атайды.","options":["I топ","II топ","III топ","IV топ"]},"answer":{"correct":0},"explanation":"Бұл — I топ: 4-кесте бойынша оның қаны I, II, III және IV топтарға жарайды."}}},{"id":"bio8-21-c02","topic_id":"bio8-21","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"87"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Какая это группа крови? Эта группа — универсальный реципиент.","options":["I группа","II группа","III группа","IV группа"]},"answer":{"correct":3},"explanation":"Это IV группа (AB): она принимает кровь групп I, II, III и IV."},"kk":{"body":{"stem":"Бұл қай қан тобы? Бұл топ — әмбебап реципиент.","options":["I топ","II топ","III топ","IV топ"]},"answer":{"correct":3},"explanation":"Бұл — IV топ (AB): ол I, II, III және IV топ қанын қабылдайды."}}},{"id":"bio8-21-c03","topic_id":"bio8-21","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"86"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Какая это группа крови? Подходит донорская кровь лишь двух видов: I и II.","options":["I группа","II группа","III группа","IV группа"]},"answer":{"correct":1},"explanation":"Это II группа (A): по таблице 4 она принимает кровь своей группы и I."},"kk":{"body":{"stem":"Бұл қай қан тобы? Донор қанының тек екі түрі жарайды: I және II.","options":["I топ","II топ","III топ","IV топ"]},"answer":{"correct":1},"explanation":"Бұл — II топ (A): 4-кесте бойынша ол өз тобының және I топтың қанын қабылдайды."}}},{"id":"bio8-21-c04","topic_id":"bio8-21","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"86"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Какая это группа крови? Эту группу обозначают буквой B (генотип BB или B0).","options":["I группа","II группа","III группа","IV группа"]},"answer":{"correct":2},"explanation":"Это III группа: на её эритроцитах агглютиноген B."},"kk":{"body":{"stem":"Бұл қай қан тобы? Бұл топты B әрпімен белгілейді (генотипі BB немесе B0).","options":["I топ","II топ","III топ","IV топ"]},"answer":{"correct":2},"explanation":"Бұл — III топ: оның эритроциттерінде B агглютиногені бар."}}},{"id":"bio8-21-c05","topic_id":"bio8-21","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"87"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Какая это группа крови? Её кровь годится лишь обладателям той же группы, больше никому.","options":["I группа","II группа","III группа","IV группа"]},"answer":{"correct":3},"explanation":"Это IV группа: по таблице 4 её кровь принимает только IV группа."},"kk":{"body":{"stem":"Бұл қай қан тобы? Оның қаны тек осы топ иелеріне ғана жарайды, басқа ешкімге жарамайды.","options":["I топ","II топ","III топ","IV топ"]},"answer":{"correct":3},"explanation":"Бұл — IV топ: 4-кесте бойынша оның қанын тек IV топ қабылдайды."}}},{"id":"bio8-21-c06","topic_id":"bio8-21","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"86"},{"source_id":"src-bio8-kk","pages":"92"}],"versions":{"ru":{"body":{"stem":"Какая это группа крови? Эту группу обозначают «00»: на эритроцитах нет ни агглютиногена A, ни агглютиногена B.","options":["I группа","II группа","III группа","IV группа"]},"answer":{"correct":0},"explanation":"Это I группа (0)."},"kk":{"body":{"stem":"Бұл қай қан тобы? Бұл топты «00» деп белгілейді: эритроциттерінде A агглютиногені де, B агглютиногені де жоқ.","options":["I топ","II топ","III топ","IV топ"]},"answer":{"correct":0},"explanation":"Бұл — I топ (0)."}}},{"id":"bio8-22-q01","topic_id":"bio8-22","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":4,"item_sources":[{"source_id":"src-bio8-ru","pages":"90–91"},{"source_id":"src-bio8-kk","pages":"96"}],"versions":{"ru":{"body":{"stem":"Какой слой стенки сосуда сужает и расширяет его просвет?","options":["Наружный слой из плотной соединительной ткани","Средний слой из гладких мышечных волокон","Внутренний слой из плоских эпителиальных клеток","Околосердечная жидкость"]},"answer":{"correct":1},"explanation":"Гладкие мышцы среднего слоя, сокращаясь и расслабляясь, меняют диаметр просвета и так направляют кровь в нужные органы."},"kk":{"body":{"stem":"Қан тамыры қабырғасының қай қабаты оның қуысын тарылтып, кеңейтеді?","options":["Тығыз дәнекер ұлпасынан тұратын сыртқы қабат","Бірыңғай салалы бұлшық ет талшықтарынан тұратын ортаңғы қабат","Жалпақ эпителий жасушаларынан тұратын ішкі қабат","Жүрек қабындағы сұйықтық"]},"answer":{"correct":1},"explanation":"Ортаңғы қабаттың бірыңғай салалы бұлшық еттері жиырылып, босаңсып, қуыстың диаметрін өзгертеді және қанды қажетті мүшелерге таратады."}}},{"id":"bio8-22-q02","topic_id":"bio8-22","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"92"},{"source_id":"src-bio8-kk","pages":"98"}],"versions":{"ru":{"body":{"stem":"Сколько камер в сердце рыб (по таблице 5)?","options":["Четыре: 2 предсердия и 2 желудочка","Три: 2 предсердия и 1 желудочек","Две: 1 предсердие и 1 желудочек","Сердца нет, его роль выполняют кольцевые сосуды"]},"answer":{"correct":2},"explanation":"У рыб двухкамерное сердце. Три камеры — у земноводных и пресмыкающихся, четыре — у птиц и млекопитающих."},"kk":{"body":{"stem":"5-кесте бойынша балықтардың жүрегінде неше қуыс бар?","options":["Төрт: 2 жүрекше және 2 қарынша","Үш: 2 жүрекше және 1 қарынша","Екі: 1 жүрекше және 1 қарынша","Жүрек жоқ, оның қызметін сақиналы қан тамырлары атқарады"]},"answer":{"correct":2},"explanation":"Балықтардың жүрегі екі қуысты. Үш қуыс — қосмекенділер мен жорғалаушыларда, төрт қуыс — құстар мен сүтқоректілерде."}}},{"id":"bio8-22-q03","topic_id":"bio8-22","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"91"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Почему кровь по венам движется к сердцу? Выберите все причины, названные в учебнике.","options":["Мощный мышечный слой вен проталкивает кровь","Сокращаются скелетные мышцы","В грудной полости низкое давление","Капилляры сокращаются и выдавливают кровь","Клапаны не дают крови стекать обратно"]},"answer":{"correct":[1,2,4]},"explanation":"Мышечный слой вен тонкий и слабый; кровь идёт к сердцу благодаря низкому давлению в груди, работе скелетных мышц и клапанам."},"kk":{"body":{"stem":"Неліктен қан веналармен жүрекке қарай қозғалады? Оқулықта аталған барлық себепті таңдаңдар.","options":["Веналардың қалың бұлшық ет қабаты қанды айдайды","Қаңқа бұлшық еттері жиырылады","Кеуде қуысында қысым төмен","Капиллярлар жиырылып, қанды сығып шығарады","Қақпақшалар қанның кері ағуына кедергі жасайды"]},"answer":{"correct":[1,2,4]},"explanation":"Веналардың бұлшық ет қабаты жұқа және әлсіз; қан жүрекке кеудедегі төмен қысымның, қаңқа бұлшық еттерінің жұмысы мен қақпақшалардың арқасында жетеді."}}},{"id":"bio8-22-q04","topic_id":"bio8-22","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"92"},{"source_id":"src-bio8-kk","pages":"98"}],"versions":{"ru":{"body":{"stem":"Соотнесите группу животных и строение сердца по таблице 5.","left":["Рыбы","Земноводные","Млекопитающие","Насекомые"],"right":["1 предсердие и 1 желудочек","2 предсердия и 1 желудочек без перегородки, кровь смешанная","2 предсердия и 2 желудочка","Нет деления на предсердия и желудочки"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"По таблице 5 у позвоночных число камер растёт от 2 (рыбы) до 4 (птицы, млекопитающие); у насекомых сердце — часть спинного сосуда без предсердий и желудочков."},"kk":{"body":{"stem":"5-кесте бойынша жануарлар тобын жүрек құрылысымен сәйкестендіріңдер.","left":["Балықтар","Қосмекенділер","Сүтқоректілер","Бунақденелілер"],"right":["1 жүрекше және 1 қарынша","2 жүрекше және пердесі жоқ 1 қарынша, қан аралас","2 жүрекше және 2 қарынша","Жүрекше мен қарыншаға бөлінбеген"],"display_order":[2,0,3,1]},"answer":{"pairs":[[0,0],[1,1],[2,2],[3,3]]},"explanation":"5-кесте бойынша омыртқалыларда қуыстар саны 2-ден (балықтар) 4-ке дейін (құстар, сүтқоректілер) артады; бунақденелілерде жүрек жүрекше мен қарыншаға бөлінбеген."}}},{"id":"bio8-22-q05","topic_id":"bio8-22","type":"order","difficulty":2,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"91–92"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Расставьте по порядку путь крови от сердца к органу и обратно.","items":["Сердце выталкивает кровь в аорту","Кровь идёт по артериям, давление высокое","В капиллярах органа идёт обмен газов и веществ","По венам кровь возвращается к сердцу"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"Артерии несут кровь от сердца, капилляры соединяют артерии и вены, вены несут кровь к сердцу."},"kk":{"body":{"stem":"Қанның жүректен мүшеге және кері қарай жолын ретімен орналастырыңдар.","items":["Жүрек қанды қолқаға айдайды","Қан артериялармен ағады, қысым жоғары","Мүше капиллярларында газ және зат алмасу жүреді","Қан веналармен жүрекке қайтады"],"start":[2,0,3,1]},"answer":{"order":[0,1,2,3]},"explanation":"Артериялар қанды жүректен таратады, капиллярлар артериялар мен веналарды байланыстырады, веналар қанды жүрекке әкеледі."}}},{"id":"bio8-22-q06","topic_id":"bio8-22","type":"fill","difficulty":1,"origin":"ai","status":"draft","notes_point":8,"item_sources":[{"source_id":"src-bio8-ru","pages":"93"},{"source_id":"src-bio8-kk","pages":"98"}],"versions":{"ru":{"body":{"template":"Средний слой сердца — {{1}} — состоит из поперечнополосатой мышцы, а наружный слой — {{2}} — образует сердечную сумку.","choices":["эндокард","миокард","перикард","аорта"]},"answer":{"blanks":[1,2]},"explanation":"Перикард — наружный слой, миокард — мышечный средний, эндокард — внутренний из гладкого эпителия."},"kk":{"body":{"template":"Жүректің ортаңғы қабаты — {{1}} — көлденең жолақты бұлшық еттен тұрады, ал сыртқы қабаты — {{2}} — жүрек қабын түзеді.","choices":["эндокард","миокард","перикард","қолқа"]},"answer":{"blanks":[1,2]},"explanation":"Перикард — сыртқы қабат, миокард — ортаңғы бұлшық ет қабаты, эндокард — тегіс эпителийден тұратын ішкі қабат."}}},{"id":"bio8-22-q07","topic_id":"bio8-22","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"92"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Зачем стенка капилляра такая тонкая?","options":["Чтобы выдерживать самое высокое давление крови","Чтобы кровь текла по нему как можно быстрее","Чтобы не давать крови течь обратно","Чтобы через неё легко проходили кислород, углекислый газ и питательные вещества"]},"answer":{"correct":3},"explanation":"Через один слой клеток вещества и газы легко проходят между кровью и тканями. Кровь в капиллярах течёт медленно, давление в них невысокое."},"kk":{"body":{"stem":"Капилляр қабырғасы неге соншалық жұқа?","options":["Ең жоғары қан қысымына төтеп беру үшін","Қан ол арқылы мүмкіндігінше тез ағуы үшін","Қанның кері ағуына жол бермеу үшін","Ол арқылы оттек, көмірқышқыл газы мен қоректік заттар оңай өтуі үшін"]},"answer":{"correct":3},"explanation":"Жасушалардың бір қабаты арқылы заттар мен газдар қан мен ұлпалар арасында оңай өтеді. Капиллярларда қан баяу ағады."}}},{"id":"bio8-22-q08","topic_id":"bio8-22","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"91"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Из раны на руке алая кровь бьёт пульсирующей струёй. Какой сосуд повреждён и где его прижимают?","options":["Вена; прижимают ниже места ранения","Артерия; прижимают выше места ранения","Капилляр; ничего делать не нужно","Вена; прижимают выше места ранения"]},"answer":{"correct":1},"explanation":"Алая пульсирующая кровь — признак артериального кровотечения; артерию прижимают выше раны, то есть между раной и сердцем. Это очень опасно — нужно срочно вызвать помощь."},"kk":{"body":{"stem":"Қолдағы жарадан ал қызыл қан атқылап ағып тұр. Қай қан тамыры зақымданған және оны қай жерден қысады?","options":["Вена; жарақаттанған жерден төменірек қысады","Артерия; жарақаттанған жерден жоғарырақ қысады","Капилляр; ештеңе істеудің қажеті жоқ","Вена; жарақаттанған жерден жоғарырақ қысады"]},"answer":{"correct":1},"explanation":"Ал қызыл, атқылап аққан қан — артериядан қан кетуінің белгісі; артерияны жарадан жоғарырақ, яғни жара мен жүректің арасынан қысады. Бұл өте қауіпті — дереу көмек шақыру керек."}}},{"id":"bio8-22-q09","topic_id":"bio8-22","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":1,"item_sources":[{"source_id":"src-bio8-ru","pages":"90"},{"source_id":"src-bio8-kk","pages":"95"}],"versions":{"ru":{"body":{"stem":"У каких животных кровеносная система впервые появилась в эволюции и состояла только из сосудов?","options":["У кольчатых червей","У рыб","У моллюсков","У насекомых"]},"answer":{"correct":0},"explanation":"У кольчатых червей сердца нет — его роль выполняют пять мощных кольцевых сосудов. У моллюсков, членистоногих и позвоночных уже есть сердце."},"kk":{"body":{"stem":"Эволюцияда қан айналым жүйесі ең алғаш қай жануарларда пайда болды және тек қан тамырларынан тұрды?","options":["Буылтық құрттарда","Балықтарда","Ұлуларда","Бунақденелілерде"]},"answer":{"correct":0},"explanation":"Буылтық құрттарда жүрек жоқ — оның қызметін бес ірі сақиналы қан тамыры атқарады. Ұлуларда, буынаяқтыларда және омыртқалыларда жүрек бар."}}},{"id":"bio8-22-q10","topic_id":"bio8-22","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"92"},{"source_id":"src-bio8-kk","pages":"98"}],"versions":{"ru":{"body":{"stem":"У каких животных, по таблице 5, сердце четырёхкамерное? Выберите все верные ответы.","options":["Рыбы","Птицы","Земноводные","Млекопитающие","Брюхоногие моллюски"]},"answer":{"correct":[1,3]},"explanation":"Два предсердия и два желудочка — у птиц и млекопитающих. У рыб и брюхоногих моллюсков 2 камеры, у земноводных — 3."},"kk":{"body":{"stem":"5-кесте бойынша қай жануарлардың жүрегі төрт қуысты? Барлық дұрыс жауапты таңдаңдар.","options":["Балықтар","Құстар","Қосмекенділер","Сүтқоректілер","Бауыраяқты ұлулар"]},"answer":{"correct":[1,3]},"explanation":"Екі жүрекше және екі қарынша — құстар мен сүтқоректілерде. Балықтар мен бауыраяқты ұлуларда 2 қуыс, қосмекенділерде — 3."}}},{"id":"bio8-22-c01","topic_id":"bio8-22","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"91"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Какой это сосуд? Самый крупный сосуд этого вида — аорта.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":0},"explanation":"Это артерия: аорта — самая крупная артерия организма."},"kk":{"body":{"stem":"Бұл қай қан тамыры? Осы түрдегі ең ірі қан тамыры — қолқа (аорта).","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":0},"explanation":"Бұл — артерия: қолқа — ағзадағы ең ірі артерия."}}},{"id":"bio8-22-c02","topic_id":"bio8-22","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"92"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Какой это сосуд? Стенка этого сосуда состоит всего из одного слоя клеток эпителия.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":2},"explanation":"Это капилляр: у него есть только внутренний слой."},"kk":{"body":{"stem":"Бұл қай қан тамыры? Бұл қан тамырының қабырғасы эпителий жасушаларының бір ғана қабатынан тұрады.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":2},"explanation":"Бұл — капилляр: онда тек ішкі қабат бар."}}},{"id":"bio8-22-c03","topic_id":"bio8-22","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"91"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Какой это сосуд? В этих сосудах есть клапаны, которые не дают крови стекать обратно.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":1},"explanation":"Это вены: клапаны — одна из трёх причин движения крови к сердцу."},"kk":{"body":{"stem":"Бұл қай қан тамыры? Бұл қан тамырларында қанның кері ағуына кедергі жасайтын қақпақшалар бар.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":1},"explanation":"Бұл — веналар: қақпақшалар — қанның жүрекке қозғалуының үш себебінің бірі."}}},{"id":"bio8-22-c04","topic_id":"bio8-22","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"91"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Какой это сосуд? В этих сосудах самое высокое давление крови и самая большая скорость её тока.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":0},"explanation":"Это артерии: они несут кровь, которую выталкивает сердце."},"kk":{"body":{"stem":"Бұл қай қан тамыры? Бұл қан тамырларында қан қысымы ең жоғары және қан ең тез ағады.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":0},"explanation":"Бұл — артериялар: олар жүрек айдаған қанды таратады."}}},{"id":"bio8-22-c05","topic_id":"bio8-22","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":7,"item_sources":[{"source_id":"src-bio8-ru","pages":"92–93"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Какой это сосуд? В этих сосудах лёгких венозная кровь становится артериальной.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":2},"explanation":"Это капилляры: газообмен идёт в капиллярах всех органов."},"kk":{"body":{"stem":"Бұл қай қан тамыры? Өкпедегі осы қан тамырларында вена қаны артерия қанына айналады.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":2},"explanation":"Бұл — капиллярлар: газ алмасу барлық мүшелердің капиллярларында жүреді."}}},{"id":"bio8-22-c06","topic_id":"bio8-22","type":"single","subtype":"classify","difficulty":1,"origin":"ai","status":"draft","notes_point":6,"item_sources":[{"source_id":"src-bio8-ru","pages":"91–92"},{"source_id":"src-bio8-kk","pages":"97"}],"versions":{"ru":{"body":{"stem":"Какой это сосуд? Эти сосуды часто лежат прямо под кожей, и их видно как синеватые полоски.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":1},"explanation":"Это вены; артерии лежат глубоко и под кожей не видны."},"kk":{"body":{"stem":"Бұл қай қан тамыры? Бұл қан тамырлары көбіне терінің астында жатады, олар көкшіл тамырлар болып көрінеді.","options":["Артерия","Вена","Капилляр"]},"answer":{"correct":1},"explanation":"Бұл — веналар; артериялар терең орналасады және терінің астынан көрінбейді."}}},{"id":"bio8-23-q01","topic_id":"bio8-23","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":3,"item_sources":[{"source_id":"src-bio8-ru","pages":"95"},{"source_id":"src-bio8-kk","pages":"100"}],"versions":{"ru":{"body":{"stem":"У каких животных впервые появляются два круга кровообращения — большой и малый?","options":["У рыб","У земноводных","У пресмыкающихся","У птиц"]},"answer":{"correct":1},"explanation":"Земноводные — первый класс наземных позвоночных с лёгкими; у них впервые появляется малый круг. У рыб один круг."},"kk":{"body":{"stem":"Екі қан айналым шеңбері — үлкен және кіші — алғаш рет қай жануарларда пайда болды?","options":["Балықтарда","Қосмекенділерде","Жорғалаушыларда","Құстарда"]},"answer":{"correct":1},"explanation":"Қосмекенділер — өкпесі бар алғашқы құрлық омыртқалылары; кіші шеңбер алғаш рет оларда пайда болды. Балықтарда бір шеңбер бар."}}},{"id":"bio8-23-q02","topic_id":"bio8-23","type":"single","difficulty":1,"origin":"ai","status":"draft","notes_point":2,"item_sources":[{"source_id":"src-bio8-ru","pages":"94–95"},{"source_id":"src-bio8-kk","pages":"100"}],"versions":{"ru":{"body":{"stem":"Что в замкнутой кровеносной системе служит посредником между кровью и клетками тела?","options":["Гемоглобин эритроцитов","Стенка аорты","Полые вены","Межклеточная (тканевая) жидкость"]},"answer":{"correct":3},"explanation":"В замкнутой системе кровь не соприкасается с клетками тела напрямую — вещества переходят через межклеточную жидкость."},"kk":{"body":{"stem":"Тұйық қан тамырлары жүйесінде қан мен дене жасушалары арасындағы делдал не?","options":["Эритроциттердің гемоглобині","Қолқа қабырғасы","Қуыс веналар","Жасушааралық (ұлпа) сұйықтық"]},"answer":{"correct":3},"explanation":"Тұйық жүйеде қан дене жасушаларымен тікелей жанаспайды — заттар жасушааралық сұйықтық арқылы өтеді."}}},{"id":"bio8-23-q03","topic_id":"bio8-23","type":"multi","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"95–97"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Выберите все верные утверждения о малом круге кровообращения.","options":["По лёгочной артерии течёт венозная кровь","По лёгочным венам течёт венозная кровь","Малый круг проходит через лёгкие","Малый круг проходит через все органы, кроме лёгких","После лёгких кровь становится артериальной"]},"answer":{"correct":[0,2,4]},"explanation":"В малом круге названия сосудов не совпадают с типом крови: к лёгким по артерии идёт венозная кровь, обратно по венам — артериальная. Через все органы, кроме лёгких, проходит большой круг."},"kk":{"body":{"stem":"Кіші қан айналым шеңбері туралы барлық дұрыс тұжырымды таңдаңдар.","options":["Өкпе артериясымен вена қаны ағады","Өкпе веналарымен вена қаны ағады","Кіші шеңбер өкпе арқылы өтеді","Кіші шеңбер өкпеден басқа барлық мүшелер арқылы өтеді","Өкпеден өткен соң қан артерия қанына айналады"]},"answer":{"correct":[0,2,4]},"explanation":"Кіші шеңберде тамыр атаулары қан типіне сәйкес келмейді: өкпеге артериямен вена қаны барады, кері веналармен артерия қаны қайтады. Өкпеден басқа барлық мүше арқылы үлкен шеңбер өтеді."}}},{"id":"bio8-23-q04","topic_id":"bio8-23","type":"match","difficulty":2,"origin":"ai","status":"draft","notes_point":5,"item_sources":[{"source_id":"src-bio8-ru","pages":"95–97"},{"source_id":"src-bio8-kk","pages":"102"}],"versions":{"ru":{"body":{"stem":"Соотнесите сосуд и то, какую кровь и куда он несёт.","left":["Аорта","Лёгочная артерия","Лёгочные вены","Полые вены"],"right"
